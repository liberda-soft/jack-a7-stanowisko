<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stanowisko JACK A7</title>
<meta name="description" content="Interaktywny model 3D stębnówki JACK A7 z diagnostyką ściegu, naprężeniem nici, ustawieniami dla tkanin i nawlekaniem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen workbench — 3D stage on the left, tabbed service manual on the right; stacks on phones. */
:root{
  --bg:#edf1f3; --surface:#ffffff; --sunk:#f4f7f8; --ink:#13212a; --muted:#566771; --line:#d4dde2;
  --accent:#0e9ccf; --accent-ink:#0a6f95; --accent-soft:#e0f3fb; --on-accent:#ffffff;
  --wood:#c27b42; --wood-soft:#f7e8da;
  --good:#1f7d55; --warn:#a9650a; --bad:#bf3527;
  --good-soft:#e2f3ea; --warn-soft:#fbefdc; --bad-soft:#f9e4e1;
  --stage-a:#fbfcfc; --stage-b:#d5dee3;
  --fabric:#cbd5da; --fabric-2:#aebbc2;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1216; --surface:#111b21; --sunk:#0e171c; --ink:#e2ebef; --muted:#8fa1ab; --line:#223139;
  --accent:#38bfe9; --accent-ink:#86d8f3; --accent-soft:#0f2d39; --on-accent:#03202b;
  --wood:#dd9e67; --wood-soft:#36271b;
  --good:#4fc48c; --warn:#e6a443; --bad:#ef7363;
  --good-soft:#12301f; --warn-soft:#352612; --bad-soft:#3a1915;
  --stage-a:#1d2a31; --stage-b:#090f12;
  --fabric:#3b4a51; --fabric-2:#2b383e; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b1216; --surface:#111b21; --sunk:#0e171c; --ink:#e2ebef; --muted:#8fa1ab; --line:#223139;
  --accent:#38bfe9; --accent-ink:#86d8f3; --accent-soft:#0f2d39; --on-accent:#03202b;
  --wood:#dd9e67; --wood-soft:#36271b;
  --good:#4fc48c; --warn:#e6a443; --bad:#ef7363;
  --good-soft:#12301f; --warn-soft:#352612; --bad-soft:#3a1915;
  --stage-a:#1d2a31; --stage-b:#090f12;
  --fabric:#3b4a51; --fabric-2:#2b383e; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.01em;line-height:1.05;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.spec{font:500 11.5px/1.4 var(--f-mono);color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.spec b{color:var(--ink);font-weight:500}
.ruler{grid-column:1/-1;height:12px;border-top:1px solid var(--wood);
  background:
   repeating-linear-gradient(90deg,var(--wood) 0 1px,transparent 1px 50px) top/100% 11px no-repeat,
   repeating-linear-gradient(90deg,var(--wood) 0 1px,transparent 1px 10px) top/100% 5px no-repeat;opacity:.75}
.head-wrap{display:grid;gap:8px}
.app>*,.work>*,.head-wrap>*{min-width:0}

/* workbench */
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);gap:12px;min-height:0}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 40% 30%,var(--stage-a),var(--stage-b))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.hot{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--surface);
  background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer;padding:0;transition:transform .15s,opacity .2s}
.dot:hover,.dot.on{transform:scale(1.35)}
.dot.dim{opacity:.35}
.dot.on{background:var(--wood)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px/1.3 var(--f-body);padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(12px,-120%);z-index:3}
.tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.tools button{pointer-events:auto}
.chip{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);
  border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none;z-index:1}
.legend{position:absolute;right:12px;bottom:10px;font:500 11.5px var(--f-mono);color:var(--muted);display:flex;gap:10px;z-index:1}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.partcard{position:absolute;left:12px;bottom:36px;width:min(360px,calc(100% - 24px));max-height:60%;overflow:auto;z-index:4;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.partcard h3{margin:0 26px 4px 0;font:700 17px/1.2 var(--f-display);font-stretch:92%}
.partcard p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}

/* side */
.side{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 6px 0;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 11px 10px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panes{flex:1;min-height:0;overflow:auto;padding:16px 16px 24px}
.pane{display:grid;gap:14px;align-content:start}
h2{margin:0;font:700 20px/1.15 var(--f-display);font-stretch:90%;text-wrap:balance}
h4{margin:0;font:600 12px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.stack{display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);color:var(--ink);font:inherit}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .chip{background:var(--sunk);backdrop-filter:none}
.filters .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.feature{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.feature strong{display:block;font:700 15.5px/1.25 var(--f-display);font-stretch:92%}
.feature span{font-size:13px;color:var(--muted)}
.feature svg{width:46px;height:46px}

.list{display:grid;gap:6px}
.item{display:grid;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item b{font-weight:600;font-size:14.5px}
.item small{color:var(--muted);font-size:12.5px;line-height:1.4}
.cat{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}

.back{justify-self:start;border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:0}
.symptom{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.q{border-left:3px solid var(--wood);padding:4px 0 4px 10px;font-size:14px}
.cause{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.cause header{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.cause header b{font-size:14.5px;line-height:1.35}
.pill{flex:none;font:600 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:999px}
.p-hi{background:var(--bad-soft);color:var(--bad)} .p-mid{background:var(--warn-soft);color:var(--warn)} .p-lo{background:var(--sunk);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.steps label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:13.8px;cursor:pointer;padding:3px 0}
.steps input{margin:3px 0 0;accent-color:var(--accent)}
.steps input:checked + span{color:var(--muted);text-decoration:line-through}
.show{justify-self:start;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
.show:hover{border-color:var(--accent);color:var(--accent-ink)}

/* tension sim */
.sim{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sim svg{display:block;width:100%;height:auto;background:var(--sunk)}
.sim .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.ctrl label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.ctrl output{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.ctrl input{width:100%;accent-color:var(--accent)}
.ctrl.lower input{accent-color:var(--wood)}
.verdict{padding:12px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:14px}
.verdict b{font:700 15px/1.3 var(--f-display);font-stretch:92%}
.verdict.ok b{color:var(--good)} .verdict.warn b{color:var(--warn)} .verdict.bad b{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tw table tr:last-child td{border-bottom:0}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:14px}
.box p{margin:0}

/* fabrics */
.fabrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.fab{border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:left;background:var(--surface);cursor:pointer;display:grid;gap:2px}
.fab b{font-size:13.5px;line-height:1.25}
.fab small{font:500 11px var(--f-mono);color:var(--muted)}
.fab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:minmax(110px,36%) 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.8px;min-width:0}
.kv div:nth-child(odd){background:var(--sunk);color:var(--muted);font-size:12.5px;font-weight:600}
.kv div:nth-last-child(-n+2){border-bottom:0}
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:9px;padding:8px 13px;cursor:pointer;font-size:13.5px}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}

/* threading */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.tsteps{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:s}
.tsteps button{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:8px;border:1px solid transparent;background:none;border-radius:9px;padding:7px 8px;cursor:pointer;font-size:13.8px;align-items:start}
.tsteps button:hover{background:var(--sunk)}
.tsteps button .n{font:600 12px/22px var(--f-mono);width:24px;height:24px;border-radius:50%;text-align:center;background:var(--sunk);border:1px solid var(--line)}
.tsteps button.done .n{background:var(--wood-soft);border-color:var(--wood);color:var(--wood)}
.tsteps button.cur{border-color:var(--accent);background:var(--accent-soft)}
.tsteps button.cur .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* panel buttons */
.pbtns{display:grid;gap:6px}
.pb{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.pb .ic{font:600 13px/1 var(--f-mono);background:#0c1013;color:#e9eef1;border-radius:8px;height:40px;display:grid;place-items:center;border:1px solid #2a3238}
.pb b{font-size:14px}
.pb p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pb.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{border-color:var(--accent);background:var(--accent-soft)}100%{}}
code,.code{font-family:var(--f-mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px}
a{color:var(--accent-ink)}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width: 920px){
  html,body{height:auto}
  .app{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .hint{display:none}
  .stage{height:60vh;min-height:360px}
  .side{overflow:visible}
  .panes{overflow:visible}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:5}
}
@media (max-width: 480px){ .sim .ctrls{grid-template-columns:1fr} .legend{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <div class="head-wrap">
    <header class="top">
      <div class="brand">
        <h1>Stanowisko <span>JACK A7</span></h1>
        <p>Stębnówka z elektronicznym transportem — model 3D, diagnostyka i ustawienia</p>
      </div>
      <div class="spec" aria-label="Dane maszyny">
        <span>AC servo <b>550 W</b></span><span>max <b>5000 rpm</b></span><span><b>220 V</b> 50/60 Hz</span><span>S/N <b>1102522P023440165</b></span>
      </div>
    </header>
    <div class="ruler" aria-hidden="true"></div>
  </div>

  <main class="work">
    <section class="stage" id="stage" aria-label="Model 3D maszyny">
      <canvas id="gl" aria-label="Model 3D. Przeciągnij, aby obracać. Kliknij część, aby zobaczyć opis."></canvas>
      <div class="loading" id="loading">Ładowanie modelu 3D…</div>
      <div class="labels" id="labels"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="tools">
        <button class="chip" id="v-photo" type="button">Jak na zdjęciu</button>
        <button class="chip" id="v-head" type="button">Głowica</button>
        <button class="chip" id="v-all" type="button">Całe stanowisko</button>
        <button class="chip" id="v-hook" type="button">Chwytacz</button>
        <button class="chip" id="t-xray" type="button" aria-pressed="false">Prześwietlenie</button>
        <button class="chip" id="t-sew" type="button" aria-pressed="false">Ruch igły</button>
        <button class="chip" id="t-dots" type="button" aria-pressed="false">Punkty</button>
      </div>
      <div class="partcard" id="partcard" hidden>
        <button class="x" id="pc-x" type="button" aria-label="Zamknij opis części">×</button>
        <h3 id="pc-name"></h3>
        <p id="pc-desc"></p>
        <div id="pc-rel" class="stack"></div>
      </div>
      <div class="hint">Przeciągnij: obrót · kółko/szczypanie: zoom · kliknij część</div>
      <div class="legend"><span><i style="background:#ff5a2e"></i>nić górna</span><span><i style="background:#f2b233"></i>nawijanie</span><span>skala 1:1 · cm</span></div>
    </section>

    <aside class="side">
      <nav class="tabs" role="tablist" aria-label="Sekcje">
        <button class="tab" role="tab" data-tab="diagnoza">Diagnoza</button>
        <button class="tab" role="tab" data-tab="naprezenie">Naprężenie</button>
        <button class="tab" role="tab" data-tab="ustawienia">Ustawienia</button>
        <button class="tab" role="tab" data-tab="nawlekanie">Nawlekanie</button>
        <button class="tab" role="tab" data-tab="panel">Panel</button>
        <button class="tab" role="tab" data-tab="serwis">Serwis</button>
      </nav>
      <div class="panes" id="panes">
        <section class="pane" id="pane-diagnoza"></section>
        <section class="pane" id="pane-naprezenie" hidden></section>
        <section class="pane" id="pane-ustawienia" hidden></section>
        <section class="pane" id="pane-nawlekanie" hidden></section>
        <section class="pane" id="pane-panel" hidden></section>
        <section class="pane" id="pane-serwis" hidden></section>
      </div>
    </aside>
  </main>
</div>

<script id="kb" type="application/json">{"machine": {"model": "JACK A7 – stębnówka 1-igłowa (ścieg 301) z silnikiem Direct Drive (serwo AC wbudowane w głowicę), cyfrowym (krokowym) transportem i automatycznym obcinaczem nici", "variant_notes": "Rodzina A7 występuje w wariantach (wg dealera IIGM, brak oficjalnej karty JACK): A7-D – materiały lekkie i średnie, igły DBx1 11–18, ścieg max 5 mm, 4000 obr/min, skok igielnicy 31 mm, wysokość ząbków 0,8 mm; A7-D-7 – materiały średnie/ciężkie (firany, zasłony, włókniny), DBx1 11–18, ścieg max 7 mm, 3500 obr/min; A7-DH (zapisywany też A7-D-H) – wersja ciężka (H = heavy): denim, tekstylia domowe, kapcie jednorazowe; igły DPx5 (135x5) 18–21, ścieg max 7 mm (jedna tabela IIGM podaje 5 mm – rozbieżność), 3500 obr/min, skok igielnicy 35 mm, ząbki 1,2 mm. „D” oznacza wersję z obcinaczem/automatyką, a nie samo „direct drive” (direct drive mają wszystkie A7). Wszystkie: podnoszenie stopki ręcznie 5 mm / automatycznie 9 mm / kolanem 13 mm (IIGM). Polska instrukcja (Impall) dla bazowego A7 podaje: max 5000 ściegów/min, ścieg max 5 mm, igły DBx1 9–18 (standard 14), podnoszenie stopki standard 7 mm / max 12 mm, kolanem standard 10 mm z regulacją do 13 mm. JAK SPRAWDZIĆ SWÓJ WARIANT: tabliczka znamionowa z tyłu ramienia; ile maksymalnie da się ustawić długości ściegu na panelu (7,0 mm → wersja -7 lub DH); parametr P91 „maksymalny ścieg” (zakres 0–70, tj. 0–7,0 mm); rodzaj igły w igielnicy (DPx5 ma grubszą kolbę 2,0 mm niż DBx1 1,62 mm – NIE są zamienne). Etykieta serwa (550 W, 5000 obr/min) dotyczy silnika/sterownika – maks. prędkość głowicy ogranicza parametr P01. KODY BŁĘDÓW: pochodzą z angielskiej instrukcji sterownika A7 (ManualsLib, 10 stron, tekst wyekstrahowany maszynowo i częściowo pomieszany) – opisy kodów są pewne, ale przypisanie części działań naprawczych do kodów zostało zrekonstruowane i oznaczone. Nie znaleziono kodów E-xx ani Err-02/09/19/22–29 dla A7. Numery i zakresy parametrów P również z tej instrukcji; wartości domyślne części parametrów nieczytelne w źródle – sprawdź na wyświetlaczu.", "specs": [{"k": "Typ ściegu", "v": "Stębnowy dwunitkowy (301), 1 igła"}, {"k": "Napęd", "v": "Direct Drive – serwo AC wbudowane w głowicę; zasilanie AC 220 V ±20%, 50/60 Hz, moc max 550 W"}, {"k": "Prędkość maksymalna", "v": "Wg polskiej instrukcji 5000 ściegów/min (etykieta serwa 5000 obr/min); wg dealera A7-D 4000, A7-D-7 i A7-DH 3500 obr/min. Prędkość szycia swobodnego ustawia P01 (domyślnie 3800)."}, {"k": "Długość ściegu", "v": "Elektroniczna (silnik krokowy), ustawiana na panelu co 0,1 mm; max 5 mm (A7/A7-D) lub 7 mm (A7-D-7, A7-DH); limit w P91"}, {"k": "System igieł", "v": "DBx1 (16x231 / 1738) nr 9–18 (Nm 65–110), standard 14 (Nm 90); A7-DH: DPx5 (135x5) nr 18–21 (Nm 110–130)"}, {"k": "Podnoszenie stopki", "v": "Dźwignia ręczna: standard 7 mm (wg PL instrukcji; IIGM: 5 mm); automatyczne (elektromagnes): ok. 9 mm; kolanem: standard 10 mm, regulacja śrubą do 13 mm (po ustawieniu >10 mm sprawdź, czy igielnica w dolnym położeniu nie uderza w stopkę)"}, {"k": "Smarowanie", "v": "Automatyczne z zamkniętej miski olejowej (system mikro-olejenia); olej do maszyn szwalniczych „biały 10” (olej biały ISO VG 10, np. typu Juki New Defrix No.1 / Esso Teresso 10 – odpowiedniki (praktyka ogólna)); poziom między dolną a górną kreską wskaźnika; czujnik niskiego poziomu (P34, alarm Err-20)"}, {"k": "Okienko oleju", "v": "W okienku kontrolnym na ramieniu ma być widoczne rozbryzgiwanie oleju podczas pracy; instrukcja zaznacza, że rozbryzg NIE świadczy o ilości oleju w misce – poziom sprawdzaj na wskaźniku z kreskami"}, {"k": "Szpulka / chwytacz", "v": "Chwytacz rotacyjny poziomej osi (standard stębnówki 1-igłowej), szpulka standardowa typu „Juki DDL” ok. Ø21 mm (praktyka ogólna – sprawdź z oryginałem; w A7-DH chwytacz/szpulka mogą być większe)"}, {"k": "Obcinacz nici", "v": "Automatyczny (elektromagnes), końcówka nici po obcięciu ok. 3,5 mm (dealer); docisk nici na starcie (nipper)"}, {"k": "Funkcje elektroniczne", "v": "4 trajektorie transportu (ząbków), czujnik grubości materiału, rygle początkowe/końcowe, zagęszczanie ściegu, szew W, szycie odcinkowe A–D, programy wzorów, licznik sztuk/ściegów, komunikaty głosowe, port USB"}, {"k": "Warunki pracy", "v": "Temperatura 0–45°C, wilgotność 30–95% bez kondensacji; uziemienie obowiązkowe; z dala od spawarek"}, {"k": "Docieranie", "v": "Maszyna nowa lub długo nieużywana: pierwsze ok. 10 min pracy przy 1800–2200 obr/min, aby olej się rozprowadził"}]}, "sources": [{"title": "JACK A7 – Instrukcja obsługi maszyny szwalniczej (PL, dostawca Impall Łódź)", "url": "https://szyjposwojemu.pl/pl/p/file/a7ab884b2d44582b8a5f063e9b642e9f/jack-A7-instrukcja.pdf"}, {"title": "JACK A7 Operation Manual (sterownik/panel, 10 stron) – ManualsLib", "url": "https://www.manualslib.com/manual/3115546/Jack-A7.html"}, {"title": "JACK A7 – lista parametrów systemu (str. 6)", "url": "https://www.manualslib.com/manual/3115546/Jack-A7.html?page=6"}, {"title": "JACK A7 – kody błędów (str. 9–10)", "url": "https://www.manualslib.com/manual/3115546/Jack-A7.html?page=9"}, {"title": "IIGM – JACK A7 digital feeding lockstitch (tabela A7-D / A7-D-7 / A7-DH)", "url": "https://www.iigm.com/a7-digital-feeding-lockstitch-single-needle-sewing-machine.html"}, {"title": "IIGM – JACK A7 (tabela A7-D / A7-D-7 / A7-D-H)", "url": "https://www.iigm.com/a7-digital-feeding-lockstitch-sewing-machine.html"}, {"title": "JACK A Series – instrukcja (porównawczo: dane techniczne rodziny A)", "url": "https://www.manualslib.com/manual/1811911/Jack-A-Series.html"}], "panel_buttons": [{"id": "stitch_length", "name": "Długość ściegu", "icon_hint": "„+ ⫼ –” z napisem mm", "short": "„+” wydłuża, „–” skraca ścieg o 0,1 mm na każde naciśnięcie", "long": "Przytrzymanie zmienia długość płynnie (ciągłe zwiększanie/zmniejszanie). Maksimum ogranicza P91."}, {"id": "start_backtack", "name": "Rygiel początkowy (A/B)", "icon_hint": "ukośna linia z literami A i B", "short": "1× – rygiel początkowy pojedynczy, 2× – podwójny, 3× – wyłączony (świeci odpowiednia ikona). Liczbę ściegów w odcinkach A i B ustawia się w zakresie 1–F (1–15 ściegów).", "long": "Brak osobnej funkcji w instrukcji."}, {"id": "end_backtack", "name": "Rygiel końcowy (C/D)", "icon_hint": "ukośna linia z literami C i D", "short": "1× – rygiel końcowy pojedynczy, 2× – podwójny, 3× – wyłączony. Liczba ściegów C i D: 1–F (1–15).", "long": "Brak osobnej funkcji w instrukcji."}, {"id": "needle_position", "name": "Pozycja zatrzymania igły (góra/dół)", "icon_hint": "igła ze strzałkami góra/dół", "short": "Przełącza zatrzymanie igły w górze lub w dole (np. dół do obracania materiału na narożnikach).", "long": "Wg instrukcji ang. – włącza/wyłącza funkcję stopki (podnoszenia)."}, {"id": "nipper_autocycle", "name": "Docisk nici (nipper) / automatyczne szycie cyklu", "icon_hint": "nić w zacisku + kółko", "short": "Włącza/wyłącza nipper – przytrzymanie końca nici igłowej przy pierwszych ściegach (zapobiega wyciąganiu nici z igły i „ptasiemu gniazdu” na starcie).", "long": "Włącza/wyłącza automatyczne odszycie cyklu (maszyna szyje zaprogramowany odcinek sama po jednym wciśnięciu pedału)."}, {"id": "foot_lift", "name": "Podnoszenie stopki po obcięciu / po zatrzymaniu", "icon_hint": "nożyczki + stopka ze strzałką w górę", "short": "Włącza/wyłącza automatyczne podniesienie stopki po obcięciu nici.", "long": "Włącza/wyłącza podnoszenie stopki po każdym zatrzymaniu szycia (w trakcie szwu)."}, {"id": "trim", "name": "Szycie swobodne / automatyczny obcinacz", "icon_hint": "nożyczki", "short": "Wybiera tryb szycia swobodnego.", "long": "Włącza/wyłącza automatyczne obcinanie nici (ikona nożyczek na wyświetlaczu świeci, gdy aktywne). Obcięcie wyzwala się wciśnięciem pedału piętą."}, {"id": "w_seam_multi", "name": "Szew W (rygiel ciągły) / szycie odcinkowe A~D", "icon_hint": "„W/N” oraz „A~D” z łamaną linią", "short": "Włącza ryglowanie typu W (szew wzmacniający tam i z powrotem).", "long": "Włącza programowanie/szycie wg zaprogramowanych odcinków o stałej liczbie ściegów (do kilku sekcji A–D). W trybie stałych ściegów długie naciśnięcie „<” włącza/wyłącza szycie jednym wciśnięciem pedału. (Instrukcja ang. w tym miejscu jest pomieszana – sprawdź ikony na LCD.)"}, {"id": "condense", "name": "Zagęszczanie ściegu (lock / tight seam)", "icon_hint": "owal/ścieg z gęstymi kreskami na początku i końcu", "short": "Kolejne naciśnięcia: zagęszczenie na początku, na końcu, wyłączenie. Zamiast rygla wstecznego maszyna szyje kilka bardzo krótkich ściegów – estetyczne zakończenie np. na cienkich tkaninach (liczbę ściegów i długość ustawiają P74–P77, P86, P88).", "long": "Brak w instrukcji."}, {"id": "pattern", "name": "Szycie wzorów", "icon_hint": "igła z linią / wzór", "short": "Przełącza między trybem szycia wzoru a edycją wzoru.", "long": "Brak w instrukcji."}, {"id": "feed_track", "name": "Trajektoria transportu (4 tryby)", "icon_hint": "elipsa ruchu ząbków, cyfry 1–4", "short": "Każde naciśnięcie wybiera kolejną z 4 trajektorii ruchu ząbków: 1 – standard, 2 – materiały śliskie, 3 – cienkie i miękkie, 4 – ciężkie.", "long": "Brak w instrukcji."}, {"id": "sensing", "name": "Czujnik grubości materiału (sensing)", "icon_hint": "stopka nad warstwami / fala", "short": "Włącza/wyłącza czujnik grubości – przy nagłym pogrubieniu (np. krzyżujące się szwy) maszyna zwalnia, zmienia trajektorię i kompensuje długość ściegu wg ustawień H03–H07.", "long": "Wejście w ustawienia grubości: H01 (cienka część – uczenie), H02 (gruba część – uczenie), H03–H07 (liczba ściegów, prędkość, kompensacja ściegu, czułość, trajektoria)."}, {"id": "voice", "name": "Głos / powitanie", "icon_hint": "głośnik / „speaking”", "short": "Włącza/wyłącza powitanie głosowe. Gdy na wyświetlaczu jest kod błędu – odtwarza głosową podpowiedź rozwiązania.", "long": "Włącza/wyłącza wszystkie komunikaty głosowe (wyciszenie). Głośność P98, tryb P97, język P99."}, {"id": "speed_plus", "name": "Speed + (prędkość w górę)", "icon_hint": "„+” Speed+", "short": "Na ekranie głównym zwiększa prędkość maksymalną o 50 obr/min; w trybie parametrów zwiększa wartość.", "long": "Z innymi klawiszami – kombinacje serwisowe (np. podgląd wersji oprogramowania)."}, {"id": "speed_minus", "name": "Speed – (prędkość w dół)", "icon_hint": "„–” Speed–", "short": "Na ekranie głównym zmniejsza prędkość maksymalną o 50 obr/min; w trybie parametrów zmniejsza wartość.", "long": "Jak wyżej – kombinacje serwisowe."}, {"id": "left", "name": "W lewo „<”", "icon_hint": "strzałka w lewo", "short": "Przesuwa wybór parametru/cyfry w lewo; przełącza licznik sztuk/ściegów.", "long": "W trybie stałych ściegów włącza/wyłącza szycie jednym wciśnięciem (one-shot)."}, {"id": "right", "name": "W prawo „>”", "icon_hint": "strzałka w prawo", "short": "Przesuwa wybór parametru/cyfry w prawo; przełącza licznik sztuk/ściegów.", "long": "Brak w instrukcji."}, {"id": "p", "name": "P – parametry", "icon_hint": "litera P w kółku", "short": "Wejście w tryb parametrów użytkownika (ze stanu gotowości); ponowne naciśnięcie po zmianie zapisuje i wychodzi.", "long": "Zapis ustawień (cyfra/numer miga). Włączenie zasilania z przytrzymanym P – tryb parametrów serwisowych (tylko dla technika)."}, {"id": "reset", "name": "Reset (恢复出厂设置 – przywrócenie ustawień fabrycznych)", "icon_hint": "przycisk Reset", "short": "Brak działania przy krótkim naciśnięciu.", "long": "Przytrzymaj ok. 5 s – powrót do ustawień fabrycznych (kasuje własne ustawienia prędkości, rygli, trybów!). Instrukcja zaleca reset jako pierwszy krok przy wielu błędach Err."}], "parameters": {"how_to_enter": "Parametry użytkownika: przy włączonej maszynie w stanie gotowości (nie szyjąc) naciśnij krótko P. Klawiszami „<” „>” przesuwasz numer parametru/cyfrę (wybrana miga), klawiszami „+” „–” (Speed+/Speed–) zmieniasz wartość – wyświetlacz miga przy zmianie. Zapis: naciśnij P (wg instrukcji ang. krótkie P zapisuje, długie P wychodzi do ekranu głównego; wg PL – po zmianie wciśnięcie P zapisuje, ponowne wychodzi). Parametry serwisowe: włącz zasilanie trzymając wciśnięty P – NIE zmieniaj ich bez technika (kąty silnika, czujniki). Tryb monitora (M01–M49, odczyt prędkości, napięcia szyny, historii błędów) i podgląd wersji (h – panel, A – sterownik, V5 – głos) – kombinacja klawisza z P lub +/–. Przed zmianami zanotuj wartości – Reset (5 s) przywraca fabryczne. UWAGA: numery i zakresy z angielskiej instrukcji A7, tekst częściowo pomieszany; wartości domyślne oznaczone „?” są nieczytelne w źródle.", "list": [{"code": "P01", "name": "Maksymalna prędkość szycia swobodnego", "range": "200–5000 obr/min", "default": "3800", "tip": "Początkującym i na grube materiały 2000–3000. Szybciej zmienisz prędkość klawiszami Speed± (co 50 obr/min)."}, {"code": "P02", "name": "Siła lekkiego uniesienia stopki na starcie", "range": "1–100", "default": "?", "tip": "Pomaga przy grubych warstwach na początku szwu."}, {"code": "P03", "name": "Pozycja zatrzymania igły (góra/dół)", "range": "0/1", "default": "?", "tip": "To samo co przycisk igły góra/dół. Znaczenie 0/1 różni się między wersjami – sprawdź, obserwując igłę po zatrzymaniu."}, {"code": "P04", "name": "Prędkość rygla początkowego", "range": "200–3000", "default": "1800", "tip": "Gdy ściegi rygla „nie trafiają w siebie” – obniż do 1200–1500."}, {"code": "P05", "name": "Prędkość rygla końcowego", "range": "200–3000", "default": "1800", "tip": "Jak P04."}, {"code": "P06", "name": "Prędkość szwu W (ciągłego ryglowania)", "range": "200–3000", "default": "1800", "tip": ""}, {"code": "P07", "name": "Prędkość szycia odcinkowego (multi-seam)", "range": "200–4000", "default": "3700", "tip": ""}, {"code": "P08", "name": "Mikrouniesienie stopki podczas szycia (przełącznik)", "range": "0/1", "default": "?", "tip": "Może pomóc na grubych/lepkich materiałach (ekoskóra)."}, {"code": "P09", "name": "Miękki start (soft start) – włącz/wyłącz", "range": "0/1", "default": "?", "tip": "Włącz (1), gdy nić wyskakuje z igły lub plącze się na starcie albo przy cienkich tkaninach."}, {"code": "P10", "name": "Liczba ściegów miękkiego startu", "range": "1–9", "default": "?", "tip": "Zwykle 2–3."}, {"code": "P11", "name": "Prędkość miękkiego startu", "range": "100–800", "default": "400", "tip": ""}, {"code": "P12", "name": "Funkcja klawisza półściegu / wielofunkcyjnego", "range": "-8–8", "default": "?", "tip": ""}, {"code": "P13", "name": "Maks. prędkość szycia wstecz", "range": "200–4000", "default": "3200", "tip": ""}, {"code": "P14", "name": "Prędkość ściegu kompensacyjnego (półścieg)", "range": "100–800", "default": "200", "tip": ""}, {"code": "P15", "name": "Tryb przycisku dościegu (0 wył., 1 ciągły, 2 pół ściegu, 3 jeden ścieg)", "range": "0–3", "default": "?", "tip": "Dotyczy przycisku na głowicy (jeśli zamontowany)."}, {"code": "P16", "name": "Czujnik grubości – punkt zerowy", "range": "0–9999", "default": "?", "tip": "Ustawiany automatycznie przy kalibracji – nie zmieniaj ręcznie."}, {"code": "P17", "name": "Wysokość grubego materiału (zapis z H02)", "range": "0–9999", "default": "?", "tip": "Ustaw przez uczenie H02 (długie naciśnięcie przycisku sensing), nie ręcznie."}, {"code": "P25", "name": "Wysokość cienkiego materiału (zapis z H01)", "range": "AD", "default": "?", "tip": "Ustaw przez uczenie H01."}, {"code": "P18", "name": "Grube miejsce – liczba ściegów (H03)", "range": "0–50", "default": "5", "tip": "Ile ściegów maszyna szyje w trybie „grubym” po wykryciu zgrubienia."}, {"code": "P19", "name": "Grube miejsce – prędkość (H04)", "range": "200–4000", "default": "2000", "tip": "Przy łamaniu igieł na szwach krzyżowych obniż do 1200–1500."}, {"code": "P20", "name": "Grube miejsce – kompensacja długości ściegu (H05)", "range": "0–50 (×0,1 mm)", "default": "5", "tip": "Wydłuża ścieg na zgrubieniu, by nie był krótszy niż na płaskim."}, {"code": "P21", "name": "Czułość czujnika grubości (H06)", "range": "0–50", "default": "?", "tip": "Za czuły – zwalnia bez powodu; za mało – nie reaguje na szwy."}, {"code": "P22", "name": "Trajektoria transportu w grubym miejscu (H07)", "range": "1–4", "default": "4", "tip": "Domyślnie tor 4 (ciężkie). Uwaga: jedno ze źródeł opisuje P22 inaczej – zweryfikuj na panelu."}, {"code": "P23", "name": "Pedał – pozycja obcięcia nici 1", "range": "0–4095", "default": "1100", "tip": "Ustawienia pedału – zmieniaj tylko, gdy obcinanie piętą jest zbyt łatwe/trudne."}, {"code": "P24", "name": "Pedał – pozycja obcięcia nici 2 (z podniesieniem stopki)", "range": "0–4095", "default": "550", "tip": ""}, {"code": "P27", "name": "Siła obcinania nici", "range": "10–100", "default": "?", "tip": "Gdy grube nici nie są docinane – zwiększ (najpierw sprawdź noże!)."}, {"code": "P28–P31", "name": "Kąty zacisku nici (nipper) dla rygla/szwu W i zagęszczania", "range": "0–359°", "default": "130/320/130/340", "tip": "Serwisowe."}, {"code": "P34", "name": "Czujnik poziomu oleju – włącz/wyłącz", "range": "0/1", "default": "?", "tip": "Nie wyłączaj, by pozbyć się Err-20 – dolej oleju."}, {"code": "P35–P37", "name": "Prędkość 1., 2., 3. ściegu po starcie", "range": "0–3000", "default": "800 / 1500 / ?", "tip": "Niższe wartości = łagodniejszy start, mniej wyciągania nici z igły."}, {"code": "P40", "name": "Pedał – pozycja półpiętki (podniesienie stopki)", "range": "0–4095", "default": "900", "tip": "Czułość pedału – serwisowe; mechanicznie czułość regulujesz sprężyną i otworem cięgna (patrz problem z pedałem)."}, {"code": "P41", "name": "Pedał – położenie neutralne", "range": "0–4095", "default": "1600", "tip": ""}, {"code": "P42/P43", "name": "Pedał – początek/koniec strefy wolnych obrotów", "range": "0–4095", "default": "300 / 600", "tip": "Większy zakres = łatwiej szyć powoli."}, {"code": "P44", "name": "Pedał – maksymalna wartość analogowa", "range": "0–4095", "default": "4000", "tip": ""}, {"code": "P47", "name": "Cofnięcie (kąt) po obcięciu nici", "range": "200–360", "default": "359", "tip": "Serwisowe."}, {"code": "P48", "name": "Podniesienie stopki wcześniej przy obcinaniu" 58 – Chiny; w PL kontakt z dealerem)."}, {"code": "Err-03", "meaning": "Za niskie napięcie zasilania", "fix": "Odłącz zasilanie, sprawdź napięcie w gniazdku (musi być > 176 V), nie używaj długich przedłużaczy/rozgałęźników. Po ustabilizowaniu włącz ponownie; jeśli trwa – serwis."}, {"code": "Err-04", "meaning": "Przepięcie przy wyłączonym silniku (postój)", "fix": "Odłącz zasilanie, sprawdź, czy napięcie < 264 V. Włącz po normalizacji; jeśli trwa – serwis."}, {"code": "Err-05", "meaning": "Przepięcie podczas pracy", "fix": "Jak Err-04 (napięcie < 264 V). Częste hamowanie przy dużej prędkości może je wywoływać – zgłoś serwisowi, jeśli się powtarza."}, {"code": "Err-06", "meaning": "Awaria obwodu elektromagnesów (obcinacz, stopka, rygiel, nipper)", "fix": "Wyłącz zasilanie, sprawdź wtyczki i przewody elektromagnesów (luźne/uszkodzone). Test: odłącz 14-pinową wtyczkę głowicy – jeśli błąd znika, usterka w elektromagnesie; jeśli nie – w sterowniku. Serwis. (przypisanie działań zrekonstruowane)"}, {"code": "Err-07", "meaning": "Awaria obwodu pomiaru prądu", "fix": "Wyłącz na 30 s i włącz kilka razy; jeśli często wraca – serwis (sterownik). (przypisanie zrekonstruowane)"}, {"code": "Err-08", "meaning": "Zablokowanie silnika wału głównego", "fix": "Wyłącz zasilanie. Sprawdź, czy coś nie owinęło się wokół głowicy, czy w chwytaczu nie ma resztek nici (najczęstsza przyczyna!), czy nie zablokował się mimośród/transport. Obróć kołem ręcznym – musi chodzić lekko. Sprawdź wtyczkę zasilania silnika. Dalej – serwis (P61)."}, {"code": "Err-10", "meaning": "Błąd komunikacji panelu ze sterownikiem", "fix": "Wyłącz zasilanie, sprawdź kabel panelu i kabel regulatora prędkości (pedału) – czy nie jest luźny, odłączony, przetarty. Jeśli trwa – serwis."}, {"code": "Err-11", "meaning": "Błąd sygnału zatrzymania głowicy (pozycji igły)", "fix": "Brak opisu w źródle. Wyłącz na 30 s, sprawdź złącze enkodera; serwis."}, {"code": "Err-12", "meaning": "Błąd wykrywania kąta początkowego silnika", "fix": "Wyłącz i włącz 2–3 razy; serwis sprawdza P61."}, {"code": "Err-13", "meaning": "Błąd pozycji zerowej silnika (enkoder)", "fix": "Wyłącz zasilanie, sprawdź osadzenie wtyczki enkodera, podłącz ponownie i uruchom; w razie potrzeby wymiana enkodera – serwis. (przypisanie zrekonstruowane)"}, {"code": "Err-14", "meaning": "Błąd odczytu/zapisu pamięci EEPROM sterownika", "fix": "Wyłącz na 30 s, włącz. Ewentualnie Reset (5 s). Jeśli trwa – serwis. (przypisanie zrekonstruowane)"}, {"code": "Err-15", "meaning": "Zabezpieczenie przed nadmierną prędkością silnika", "fix": "Brak opisu w źródle. Wyłącz na 30 s, przywróć ustawienia fabryczne; serwis."}, {"code": "Err-16", "meaning": "Obroty silnika w odwrotnym kierunku", "fix": "Brak opisu w źródle. Nie obracaj kołem ręcznym od siebie podczas włączania; wyłącz/włącz; serwis."}, {"code": "Err-17", "meaning": "Błąd restartu sterownika głównego", "fix": "Wyłącz na 30 s i włącz; jeśli trwa – serwis. (przypisanie zrekonstruowane)"}, {"code": "Err-18", "meaning": "Przeciążenie silnika wału głównego", "fix": "Sprawdź, czy silnik nie jest blokowany (zbyt gruby materiał, nić w chwytaczu, za niski poziom oleju, brud). Zmniejsz prędkość na grubych warstwach. Serwis, jeśli powraca."}, {"code": "Err-20", "meaning": "Alarm braku oleju (sprawdzany co 8 godzin)", "fix": "Sprawdź poziom oleju i dolej olej biały 10 do poziomu między kreskami. Jeśli olej jest, a alarm trwa – czujnik poziomu/serwis. Nie wyłączaj czujnika P34."}, {"code": "Err-21", "meaning": "Zablokowanie silnika wału głównego", "fix": "1) Sprawdź głowicę: ciała obce, resztki nici w chwytaczu, zablokowany mimośród. 2) Wyłącz i sprawdź wtyczkę zasilania silnika (luźna/uszkodzona). 3) Serwis sprawdza P61. 4) Restart; jeśli trwa – serwis."}, {"code": "Err-30", "meaning": "Alarm silnika krokowego (transportu/rygla)", "fix": "Sprawdź, czy silnik krokowy, wahacz i ząbki transportu nie są zablokowane (nić, brud pod płytką). Restart. Uszkodzony enkoder silnika krokowego – wymiana (serwis)."}, {"code": "Err-31", "meaning": "Błąd pozycji zerowej silnika krokowego", "fix": "Wyłącz na 30 s i włącz. Sprawdź, czy transport/wahacz nie są zablokowane. Restart; serwis."}, {"code": "Err-32", "meaning": "Przetężenie sprzętowe silnika krokowego (faza A)", "fix": "Wyłącz na 30 s i włącz; jeśli trwa – serwis (sterownik)."}, {"code": "Err-33", "meaning": "Błąd pętli prądowej silnika krokowego (faza B)", "fix": "Wyłącz na 30 s i włącz; jeśli trwa – serwis."}, {"code": "Err-34", "meaning": "Błąd sygnału Halla silnika krokowego", "fix": "Sprawdź enkoder krokowy i sterownik, wymiana uszkodzonych, restart po 30 s; serwis. (przypisanie zrekonstruowane)"}, {"code": "Err-35", "meaning": "Awaria (element nie nazwany w źródle)", "fix": "Restart po 30 s; serwis. (opis niepełny w źródle)"}, {"code": "Alarm licznika ściegów", "meaning": "Osiągnięto ustawiony limit licznika ściegów (np. przypomnienie o wymianie szpulki)", "fix": "Naciśnij wskazany klawisz, by skasować alarm i wyzerować licznik; ustawienia P104–P111."}, {"code": "Alarm licznika obcięć", "meaning": "Osiągnięto limit licznika obcięć/sztuk", "fix": "Skasuj klawiszem i wyzeruj licznik."}, {"code": "Alarm zaniku zasilania", "meaning": "Nieprawidłowe wyłączenie/zanik zasilania", "fix": "Odczekaj 30 s i włącz wyłącznik ponownie."}, {"code": "Alarm wyłącznika bezpieczeństwa", "meaning": "Głowica przechylona / nie w pozycji roboczej", "fix": "Opuść głowicę do pozycji roboczej (czujnik przechyłu)."}, {"code": "Alarm regulatora prędkości", "meaning": "Usterka regulatora prędkości (czujnik pedału)", "fix": "Odłącz zasilanie, sprawdź, czy wtyczka regulatora prędkości nie jest poluzowana."}, {"code": "Alarm pozycji silnika krokowego", "meaning": "Silnik krokowy poza pozycją", "fix": "Sprawdzenie pozycji montażu silnika krokowego – kalibracja P123 (serwis)."}, {"code": "Blokada hasłem", "meaning": "Maszyna osiągnęła ustawiony limit czasu pracy (blokada dealera/leasingu)", "fix": "Kontakt ze sprzedawcą/serwisem w celu odbloko y"], "fix_steps": ["Pokrętło naprężacza głównego obróć zgodnie z ruchem wskazówek zegara o 1/4 obrotu (90°).", "Przeszyj 10 cm próbki i obejrzyj obie strony.", "Powtarzaj co 1/4 obrotu, aż splot schowa się w środku tkaniny."]}, {"cause": "Za mocne naprężenie nici dolnej (bębenek)", "likelihood": "srednie", "parts": ["bobbin_case"], "fix_steps": ["Wykonaj test opadania bębenka (patrz sekcja wyważenia).", "Jeśli bębenek nie opada wcale – poluzuj śrubkę sprężyny bębenka (przeciwnie do ruchu wskazówek zegara) o 1/8 obrotu (45°) i powtórz test."]}, {"cause": "Szorstki/zadziorowany chwytacz lub płytka – nić zaczepia i nie jest dociągana", "likelihood": "niskie", "parts": ["hook", "needle_plate"], "fix_steps": ["Oczyść chwytacz z kłaczków i resztek nici.", "Sprawdź palcem/nitką krawędzie otworu płytki i nosek chwytacza – zadziory wygładź drobnym papierem (1200+) lub wymień część (technik)."]}]}, {"id": "petelki_gora", "title": "Pętelki od góry materiału", "symptoms": "Na wierzchniej stronie widać luźne pętelki nici dolnej lub szew jest „kropkowany” nicią dolną.", "category": "scieg", "diagnose_question": "Czy nić dolna przechodzi pod sprężynką bębenka i stawia opór przy wyciąganiu?", "causes": [{"cause": "Nić dolna nie przechodzi pod sprężyną naprężacza bębenka (wypadła ze szczeliny)", "likelihood": "wysokie", "parts": ["bobbin_case", "bobbin"], "fix_steps": ["Wyłącz zasilanie, wyjmij bębenek.", "Przeciągnij nić przez szczelinę bębenka i pod sprężynką aż wyjdzie otworem/wycięciem na końcu sprężynki.", "Pociągnij nić – szpulka ma się obracać zgodnie z ruchem wskazówek zegara i nić musi stawiać równy, lekki opór."]}, {"cause": "Za słabe naprężenie nici dolnej", "likelihood": "wysokie", "parts": ["bobbin_case"], "fix_steps": ["Test opadania: bębenek ze szpulką trzymany za nić opada sam bez szarpnięcia – za luźno.", "Dokręć śrubkę sprężyny bębenka zgodnie z ruchem wskazówek zegara o 1/8 obrotu (45°), maksymalnie 1/4 obrotu naraz.", "Powtórz test opadania i próbę szycia."]}, {"cause": "Za mocne naprężenie nici górnej (ściąga nić dolną do góry)", "likelihood": "srednie", "parts": ["tension_assembly"], "fix_steps": ["Poluzuj pokrętło naprężacza przeciwnie do ruchu wskazówek zegara o 1/4 obrotu.", "Próba – jeśli szew się marszczy, a nić górna jest napięta jak struna, poluzuj dalej."]}, {"cause": "Szpulka źle nawinięta (luźno, nierówno) lub nie pasuje do bębenka / bębenek zabrudzony", "likelihood": "srednie", "parts": ["bobbin", "bobbin_case", "bobbin_winder"], "fix_steps": ["Sprawdź, czy nawój jest twardy i równy – miękki nawój daje skoki naprężenia.", "Oczyść bębenek pod sprężyną z kłaczków (pędzelek, kartka papieru przeciągnięta pod sprężyną).", "Używaj oryginalnych szpulek do tego bębenka (nie mieszaj aluminiowych i stalowych bez korekty naprężenia)."]}]}, {"id": "nic_dolna_na_wierzchu", "title": "Nić dolna widoczna na wierzchu", "symptoms": "Splot nici leży na górnej powierzchni materiału – na wierzchu widać punkciki/kreski nici dolnej (szczególnie przy kontrastowych kolorach).", "category": "scieg", "diagnose_question": "Czy nić górna jest wyraźnie napięta, a szew lekko marszczy materiał?", "causes": [{"cause": "Naprężenie górne za duże w stosunku do dolnego", "likelihood": "wysokie", "parts": ["tension_assembly"], "fix_steps": ["Poluzuj naprężacz górny o 1/4 obrotu (przeciwnie do ruchu wskazówek zegara).", "Przeszyj próbkę i obejrzyj; powtarzaj aż splot zniknie w środku materiału.", "Jeśli przy luźnym górnym nadal widać nić dolną – przejdź do regulacji bębenka."]}, {"cause": "Naprężenie dolne za małe", "likelihood": "wysokie", "parts": ["bobbin_case"], "fix_steps": ["Test opadania bębenka.", "Dokręć śrubkę bębenka o 1/8 obrotu (45°) zgodnie z ruchem wskazówek zegara.", "Ponownie wyważ górnym naprężaczem."]}, {"cause": "Nić dolna grubsza niż górna lub różny rodzaj nici", "likelihood": "srednie", "parts": ["bobbin"], "fix_steps": ["Użyj w szpulce nici tej samej grubości (lub cieńszej o jeden numer) co nić górna.", "Po zmianie nici ponown ", "parts": ["control_panel"], "fix_steps": ["Krótkie naciśnięcie przycisku stopki – podnoszenie po obcięciu; długie – po zatrzymaniu."]}, {"cause": "Ochrona elektromagnesu – stopka opada po czasie P57 (domyślnie 10 s)", "likelihood": "srednie", "parts": ["presser_foot"], "fix_steps": ["To normalne zabezpieczenie; podnieś ponownie piętą lub kolanownikiem."]}, {"cause": "Usterka elektromagnesu/wtyczki (Err-06)", "likelihood": "niskie", "parts": ["presser_foot", "servo_motor"], "fix_steps": ["Sprawdź wtyczki głowicy; serwis."]}]}], "stitch_balance": {"explanation": "Ścieg stębnowy powstaje z dwóch nici: górnej (z igły) i dolnej (ze szpulki w bębenku). Prawidłowo splot (miejsce, gdzie nici się przeplatają) leży DOKŁADNIE W ŚRODKU grubości materiału – z obu stron widać tylko równe kreski nici w swoim kolorze, bez kropek drugiej nici i bez pętelek. Naprężenie górne regulujesz pokrętłem naprężacza głównego na przodzie głowicy (zgodnie z ruchem wskazówek zegara = mocniej), dolne – maleńką śrubką na sprężynie bębenka (zgodnie z ruchem wskazówek zegara = mocniej). ZASADA: najpierw ustaw nić dolną testem opadania (ona jest „wzorcem”), potem wyważaj górną; śrubki bębenka dotykaj rzadko i o małe kąty. Przed regulacją zawsze sprawdź nawleczenie – w ok. 80% przypadków „złe naprężenie” to nić poza talerzykami lub pod sprężynką bębenka. Do testu użyj dwóch kontrastowych kolorów nici (np. góra czarna, dół biała) i 2 warstw docelowego materiału.", "read_stitch": [{"look": "Z obu stron równe kreski, splotu nie widać, materiał płaski", "meaning": "Naprężenie wyważone", "action": "Nic nie zmieniaj – zanotuj ustawienie dla tego materiału."}, {"look": "Pętelki/gniazdka od spodu (nić górna leży luzem na spodzie)", "meaning": "Górna za słaba lub poza talerzykami/podciągaczem (najczęściej) ALBO dolna za mocna", "action": "1) Nawlecz górę od nowa przy podniesionej stopce. 2) Dokręć górny naprężacz o 1/4 obrotu. 3) Jeśli bębenek w teście nie opada – poluzuj go o 1/8 obrotu."}, {"look": "Kropki/pętelki nici dolnej na wierzchu", "meaning": "Górna za mocna ALBO dolna za słaba lub nie pod sprężynką", "action": "1) Sprawdź nawleczenie bębenka. 2) Poluzuj górny o 1/4 obrotu. 3) Jeśli bębenek opada sam – dokręć o 1/8 obrotu."}, {"look": "Nić dolna leży prosto na spodzie, a nić górna jest z wierzchu prosto i napięta (splot u góry)", "meaning": "Nić dolna wciągana do góry – górna za mocna względem dolnej", "action": "Poluzuj górę; jeżeli przy bardzo luźnej górze dalej tak jest – dokręć dolną."}, {"look": "Nić górna widoczna na spodzie jako proste odcinki (splot u dołu)", "meaning": "Górna przeciągana na spód – górna za słaba lub dolna za mocna", "action": "Dokręć górę o 1/4 obrotu; sprawdź test opadania."}, {"look": "Szew marszczy materiał, obie nici napięte, pękają przy rozciąganiu", "meaning": "Obie nici za mocno", "action": "Poluzuj bębenek do dolnej granicy testu opadania, potem obniżaj górę aż do wyważenia."}, {"look": "Splot raz u góry, raz u dołu, naprężenie „pływa”", "meaning": "Szarpanie nici na stojaku, brud w talerzykach, nierówna szpulka, zła nić", "action": "Sprawdź stojak (prowadnik nad szpulą), wyczyść talerzyki i bębenek, nawiń nową szpulkę, wymień igłę."}, {"look": "Pętle tylko na łukach lub przy zmianie prędkości", "meaning": "Sprężynka kompensacyjna źle ustawiona lub zbyt duża prędkość", "action": "Zmniejsz prędkość; technik ustawia skok i siłę sprężynki kompensacyjnej."}], "bobbin_drop_test": "Włóż nawiniętą szpulkę do bębenka i przeciągnij nić pod sprężynką. Trzymaj bębenek za koniec nici (ok. 10–15 cm), zawieszony swobodnie. 1) Bębenek opada sam pod własnym ciężarem – naprężenie za słabe: dokręć śrubkę. 2) Bębenek wisi w miejscu, a po lekkim potrząśnięciu (ruch ręką w dół jak przy jo-jo) zsuwa się o ok. 2–5 cm i staje – naprężenie prawidłowe dla większości materiałów (lżejsze materiały – raczej 5 cm, ciężkie – 2–3 cm). 3) Nie zsuwa się nawet po mocnym potrząśnięciu – za mocno: poluzuj śrubkę. Test rób zawsze z tą samą nicią i pełną/połową szpulki, bębenek suchy i czysty. (praktyka ogólna; wartości typowe dla stębnówek przemysłowych)", "upper_tension_howto": "Pokrętło (1) naprężacza głównego na przodzie głowicy: obrót zgodnie z ruchem wskazówek zegara (kierunek A) zwiększa naprężenie, przeciwnie (B) – zmniejsza (instrukcja A7). Krok regulacji: 1/4 obrotu (90°) przy dużych błędach, 1/8 obrotu (45°) przy dopracowaniu – po każdej zmianie przeszyj 10–15 cm próbki. Regulację rób przy OPUSZCZONEJ stopce (talerzyki zamknięte). Naprężacz wstępny (mały, przed głównym) wpływa głównie na długość końcówki nici po automatycznym obcięciu: mocniejszy = krótsza końcówka (ryzyko wyskakiwania nici z igły), słabszy = dłuższa końcówka. Sprężynka kompensacyjna: skok reguluje pokrętło (3) po poluzowaniu śruby (2) – zgodnie z ruchem wskazówek zegara większy skok; siłę sprężynki zmienia się po zdjęciu zespołu naprężacza (5) i poluzowaniu śruby (4) – zgodnie z ruchem wskazówek zegara mocniej (instrukcja A7). Sprężynkę kompensacyjną najlepiej powierzyć technikowi.", "bobbin_tension_howto": "Śrubka na sprężynie bębenka (mała śrubka płaska na środku blaszki): zgodnie z ruchem wskazówek zegara – mocniej, przeciwnie – słabiej. Kroki BARDZO małe: 1/8 obrotu (45°, jak przesunięcie wskazówki minutowej o ok. 7–8 minut), maksymalnie 1/4 obrotu naraz – 1/4 obrotu śrubki bębenka to duża zmiana. Wskazówka: zrób markerem kreskę na łebku śrubki i bębenku, aby wiedzieć, ile obróciłeś i móc wrócić. Nie odkręcaj śrubki do końca (wypada razem ze sprężynką). Po regulacji powtórz test opadania, potem wyważ ścieg górnym pokrętłem. Gdy wymieniasz szpulki aluminiowe na stalowe lub zmieniasz grubość nici – zrób test od nowa. (praktyka ogólna)"}, "threading": {"upper": [{"step": 1, "text": "Wyłącz zasilanie (instrukcja: nie podłączaj wtyczki do końca nawlekania), podnieś stopkę dźwignią ręczną – talerzyki naprężacza się rozchylą. Obróć koło ręczne do siebie, aż podciągacz nici będzie w najwyższym położeniu.", "part": "presser_foot"}, {"step": 2, "text": "Postaw stożek nici na talerzyku stojaka i przeprowadź nić przez prowadnik ramienia stojaka, który ma być dokładnie nad szpulą.", "part": "thread_stand"}, {"step": 3, "text": "Przeprowadź nić przez prowadnik nici na górze ramienia maszyny (z tyłu do przodu), a następnie przez otwory prowadnika nad naprężaczem (zygzakiem, wg rysunku na głowicy).", "part": "arm_thread_guide"}, {"step": 4, "text": "Przeprowadź nić przez naprężacz wstępny (mały).", "part": "pretension"}, {"step": 5, "text": "Owiń nić wokół naprężacza głównego między talerzykami – pociągnij lekko w dół, aż poczujesz, że nić weszła głęboko między talerzyki.", "part": "tension_assembly"}, {"step": 6, "text": "Pociągnij nić w górę tak, by zaczepiła o sprężynkę kompensacyjną (sprężynka musi się lekko odchylić).", "part": "check_spring"}, {"step": 7, "text": "Przeprowadź nić przez prowadnik nad naprężaczem i przez oczko dźwigni podciągacza nici od prawej do lewej.", "part": "take_up_lever"}, {"step": 8, "text": "Sprowadź nić w dół przez prowadniki na czołownicy i prowadnik nici na igielnicy (zaczep na dole igielnicy).", "part": "needle_bar_guide"}, {"step": 9, "text": "Nawlecz igłę od lewej do prawej (długi rowek igły jest po lewej stronie) i wyciągnij ok. 5 cm końcówki nici za stopkę.", "part": "needle"}, {"step": 10, "text": "Kontrola: opuść stopkę i pociągnij nić przy igle – ma być wyraźny, równy opór. Brak oporu = nić poza talerzykami, nawlecz ponownie.", "part": "tension_assembly"}], "bobbin_insert": [{"step": 1, "text": "Wyłącz zasilanie lub upewnij się, że pedał nie jest wciśnięty. Ustaw igłę w górnym położeniu (koło ręczne do siebie).", "part": "handwheel"}, {"step": 2, "text": "Odsuń płytkę suwakową (osłonę chwytacza) po lewej stronie płytki ściegowej, odchyl zatrzask bębenka i wyjmij bębenek z chwytacza.", "part": "bobbin_case"}, {"step": 3, "text": "Włóż szpulkę do bębenka tak, aby nić odwijała się zgodnie z ruchem wskazówek zegara (patrząc na otwartą stronę bębenka).", "part": "bobbin"}, {"step": 4, "text": "Wprowadź nić w szczelinę na brzegu bębenka i przeciągnij pod sprężynę naprężacza, aż wyjdzie wycięciem/otworkiem na końcu sprężyny.", "part": "bobbin_case"}, {"step": 5, "text": "Kontrola: pociągnij nić – szpulka ma obracać się zgodnie z ruchem wskazówek zegara (w kierunku strzałki), lekko i równo; nie może kręcić się „sama” po puszczeniu nici. Zostaw ok. 5 cm końcówki.", "part": "bobbin"}, {"step": 6, "text": "Trzymając zatrzask, nasadź bębenek na trzpień chwytacza do oporu, aż wyraźnie kliknie, i puść zatrzask. Niedosunięty bębenek = łamanie igły, hałas, plątanie.", "part": "hook"}, {"step": 7, "text": "Przytrzymaj nić górną, obróć koło ręczne do siebie o pełny obrót – igła wyciągnie pętlę nici dolnej przez otwór płytki. Wyciągnij obie nici pod stopką do tyłu.", "part": "needle_plate"}, {"step": 8, "text": "Zasuń płytkę suwakową. (Przy obcinaczu automatycznym nie trzeba wyciągać nici dolnej ręcznie – wystarczy przytrzymać nić górną na pierwszych ściegach lub włączyć nipper.)", "part": "needle_plate"}], "bobbin_winding": [{"step": 1, "text": "Nałóż pustą szpulkę na trzpień nawijacza (po prawej stronie głowicy, przy kole ręcznym) i dociśnij do oporu.", "part": "bobbin_winder"}, {"step": 2, "text": "Nić z drugiego stożka na stojaku przeprowadź przez prowadnik stojaka i naprężacz nawijacza na ramieniu maszyny.", "part": "thread_stand"}, {"step": 3, "text": "Owiń koniec nici kilka razy (5–6 zwojów) wokół piasty szpulki zgodnie z ruchem wskazówek zegara lub przewlecz przez otworek szpulki.", "part": "bobbin"}, {"step": 4, "text": "Dociśnij dźwignię nawijacza do szpulki – kółko nawijacza dotknie napędu.", "part": "bobbin_winder"}, {"step": 5, "text": "Podnieś stopkę (lub wyjmij nić z igły i usuń materiał, żeby nie szyć „na sucho” z nicią) i wciśnij pedał – nawijanie odbywa się w czasie pracy maszyny; możesz nawijać równocześnie z szyciem.", "part": "pedal"}, {"step": 6, "text": "Nawijacz wyłącza się sam przy pełnej szpulce (ok. 80% średnicy). Ilość nawoju ustawia śruba na dźwigni nawijacza. Odetnij nić na nożyku nawijacza.", "part": "bobbin_winder"}, {"step": 7, "text": "Kontrola: nawój twardy i równy. Gdy nici więcej po jednej stronie – przesuń naprężacz/prowadnik nawijacza w stronę krawędzi z mniejszą ilością nici (praktyka ogólna). Gdy nawój miękki – dokręć naprężacz nawijacza.", "part": "bobbin_winder"}]}, "maintenance": [{"interval": "Przed pierwszym uruchomieniem / po długim postoju", "task": "Napełnij miskę olejem białym 10 do poziomu między dolną a górną kreską. Pierwsze ok. 10 min pracy przy 1800–2200 obr/min, aby rozprowadzić olej (instrukcja A7).", "parts": ["oil_window", "servo_motor"]}, {"interval": "Codziennie przed pracą", "task": "Sprawdź poziom oleju (między kreskami) i rozbryzg w okienku kontrolnym podczas pracy. Usuń kłaczki z okolic chwytacza, bębenka i ząbków (pędzelek – nie wdmuchuj brudu w maszynę sprężonym powietrzem). Sprawdź igłę (prosta, ostra).", "parts": ["oil_window", "hook", "bobbin_case", "feed_dog"]}, {"interval": "Co 8 godzin pracy (sygnalizuje Err-20)", "task": "Kontrola poziomu oleju i dolanie, jeśli trzeba.", "parts": ["oil_window"]}, {"interval": "Co zmianę / co 1–2 dni szycia albo po każdym uderzeniu w szpilkę", "task": "Wymiana igły (przy syntetykach i denimie częściej). Igłę wymieniaj przy wyłączonej maszynie: igielnica w górze, rowek w lewo, do oporu. (praktyka ogólna)", "parts": ["needle", "needle_bar"]}, {"interval": "Co tydzień", "task": "Zdejmij płytkę ściegową, wyczyść ząbki transportu, okolice noży obcinacza i chwytacz z kłaczków; wyczyść bębenek pod sprężyną; przeciągnij płótno między talerzykami naprężacza. Sprawdź noże obcinacza. (praktyka ogólna)", "parts": ["needle_plate", "feed_dog", "trimmer", "hook", "bobbin_case", "tension_assembly"]}, {"interval": "Co miesiąc", "task": "Odchyl głowicę (wyłączona!), usuń kurz z okolic miski olejowej i spodu; sprawdź kable, wtyczki, cięgno pedału i kolanownik; oczyść filtr wentylacji silnika/skrzynki z kurzu. (praktyka ogólna)", "parts": ["servo_motor", "pedal", "knee_lifter", "table"]}, {"interval": "Co 6 miesięcy (lub gdy olej jest ciemny/brudny)", "task": "Wymiana oleju w misce i czyszczenie filtra/knota olejowego – najlepiej przez technika. Instrukcja: nigdy nie używaj brudnego, zużytego oleju. (interwał – praktyka ogólna)", "parts": ["oil_window"]}, {"interval": "Kiedy wzywać technika", "task": "Przepuszczanie ściegów lub łamanie igieł po wymianie igły (zwłaszcza po złamaniu igły/uderzeniu) – regulacja czasu chwytacza, wysokości igielnicy (znaczniki A/B względem dolnej tulei) i szczeliny nosek–igła; uszkodzony nosek chwytacza; wysokość/pozycja ząbków; regulacja noży obcinacza; brak rozbryzgu oleju; powtarzające się Err-xx; każda praca przy elektronice (skrzynka ma wysokie napięcie – odczekaj min. 1 min po wyłączeniu). Instrukcja: przy wymianie chwytacza upewnij się, że nowy jest zgodny z poprzednim.", "parts": ["hook", "needle_bar", "feed_dog", "trimmer", "servo_motor", "control_panel"]}], "safety": ["Przed nawlekaniem, wymianą szpulki, igły, stopki, płytki lub ząbków, przed naprawą oraz przy odejściu od maszyny wyłącz zasilanie i upewnij się, że pedał nie jest wciśnięty.", "Silnik serwo w spoczynku jest bezgłośny – cisza NIE oznacza, że maszyna jest wyłączona; lekkie dotknięcie pedału uruchomi ją natychmiast.", "Nigdy nie wkładaj palców pod igłę, pod osłonę podciągacza ani w okolice chwytacza – chwytacz obraca się z bardzo dużą prędkością.", "Uważaj na włosy, szaliki, luźne rękawy i biżuterię – mogą zostać wciągnięte przez koło ręczne lub ruchome części.", "Nie pracuj bez osłon (osłona palców, osłona podciągacza, osłona oczu). Zalecane okulary ochronne – złamana igła może odprysnąć.", "Nie otwieraj skrzynki sterownika i nie dotykaj elementów elektrycznych – wysokie napięcie; po wyłączeniu odczekaj co najmniej 1 minutę.", "Używaj wyłącznie gniazdka z uziemieniem; przed podłączaniem/odłączaniem przewodów wyłącz maszynę wyłącznikiem.", "Przy kontakcie oleju ze skórą lub oczami przemyj czystą wodą i skonsultuj się z lekarzem; po połknięciu – natychmiast do lekarza.", "Przy przechylaniu głowicy przytrzymuj ją obiema rękami i nie przechylaj z rozlanym olejem; podczas opuszczania uważaj na palce między głowicą a blatem.", "Naprawy, regulacje mechaniczne i serwis elektroniki powinien wykonywać wykwalifikowany technik; stosuj oryginalne części JACK."]}</script>

<script>

/* ------------------------------------------------------------------ parts */
const PART = {
  thread_stand:{n:'Stojak na nici', d:'Teleskopowy stojak z dwoma talerzami na stożki. Górne ramię musi być dokładnie nad stożkiem — inaczej nić skacze i szarpie.', dist:120},
  arm_thread_guide:{n:'Prowadnik nici na ramieniu', d:'Pionowy pręt z oczkami na górze ramienia. Pierwsze miejsce, przez które nić wchodzi na maszynę.', dist:30},
  pretension:{n:'Prowadnik / wstępny naprężacz', d:'Prowadnik z otworami na czole głowicy. Uspokaja nić, zanim trafi między talerzyki naprężacza.', dist:24},
  tension_assembly:{n:'Naprężacz nici górnej', d:'Talerzyki z nakrętką. W prawo (zgodnie z zegarem) = mocniej, w lewo = słabiej. Reguluj ćwierć obrotu naraz.', dist:22},
  check_spring:{n:'Sprężynka kontrolna', d:'Odbiera luz nici, gdy igła schodzi w dół. Za słaba lub złamana daje pętelki i przepuszczone ściegi.', dist:20},
  take_up_lever:{n:'Podciągacz nici (niciowód)', d:'Ruchome ramię na czole głowicy, które dociąga supeł. Nić musi przejść przez jego oczko od prawej do lewej.', dist:24},
  needle_bar_guide:{n:'Prowadniki nad igłą', d:'Oczka na czole głowicy i na igielnicy prowadzące nić do ucha igły.', dist:22},
  needle_bar:{n:'Igielnica', d:'Pręt, w którym zamocowana jest igła. Jej wysokość ustawia technik razem z momentem chwytacza.', dist:20},
  needle:{n:'Igła', d:'A7-DH (wersja ciężka): igły DPx5, nr 18–21 (Nm 110–130). Wersja A7-D: DBx1 nr 11–18. Długi rowek igły od strony operatora, ucho nawlekane od lewej do prawej. Wymieniaj po uderzeniu albo gdy ścieg zaczyna przepuszczać.', dist:16},
  presser_foot:{n:'Stopka', d:'Dociska materiał do ząbków. Podnoszona dźwignią ręczną, kolanownikiem lub automatycznie.', dist:18},
  presser_pressure_screw:{n:'Śruba docisku stopki', d:'Pokrętło na szczycie głowicy. W prawo = mocniejszy docisk (grube materiały), w lewo = słabszy (cienkie, śliskie).', dist:24},
  needle_plate:{n:'Płytka ściegowa', d:'Płytka z otworem na igłę i szczelinami na ząbki. Zadziory na otworze strzępią i zrywają nić.', dist:20},
  feed_dog:{n:'Ząbki transportu', d:'Przesuwają materiał o długość ściegu. W A7 długość ustawia się elektronicznie na panelu.', dist:18},
  bobbin:{n:'Szpulka', d:'Nić dolna. Nawinięta równo, nie do pełna (ok. 80%), bez luźnych zwojów.', dist:18},
  bobbin_case:{n:'Bębenek (kapsel)', d:'Trzyma szpulkę. Mała śrubka na sprężynce reguluje naprężenie nici dolnej — obracaj bardzo małymi krokami.', dist:18},

function initGL(){

  scene = new THREE.Scene();

}

function makeEnv(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(.40, '#e3e9ed'); gr.addColorStop(.52, '#8a949b'); gr.addColorStop(1, '#3d444a');
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 512);
  g.fillStyle = 'rgba(255,255,255,.95)'; g.fillRect(140, 70, 220, 110); g.fillRect(600, 60, 300, 70); g.fillRect(450, 210, 90, 40);
  g.fillStyle = 'rgba(255,250,240,.6)'; g.fillRect(0, 230, 1024, 14);
  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer); const env = pm.fromEquirectangular(t).texture; t.dispose(); pm.dispose();
  return env;
}
function noiseTex(){
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const img = g.createImageData(256, 256);
  for(let i=0;i<img.data.length;i+=4){ const v = 128 + (Math.random()-.5)*110; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255 }
  g.putImageData(img, 0, 0); g.filter = 'blur(1.4px)'; g.drawImage(c, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

/* --- control panel: button centres measured on the rectified photo of this panel (cm, table frame) */
const PBC = (px, py) => [59.8 + px/48, 23.2 - py/48];
const PB_DEF = [
  ['len', ...PBC(630, 90), 2.2, '+ ⟷ −'], ['voice', ...PBC(727, 90), 1, '◁))'],
  ['ab', ...PBC(598, 162), 1, 'A/B'], ['needle', ...PBC(665, 162), 1, '↕'], ['trim', ...PBC(728, 162), 1, '✂'],
  ['cd', ...PBC(600, 237), 1, 'C/D'], ['feed', ...PBC(668, 237), 1, '⬭'], ['condense', ...PBC(731, 237), 1, '⇊'], ['multi', ...PBC(795, 240), 1, 'A~D'],
  ['wn', ...PBC(857, 240), 1, 'W/N'], ['clamp', ...PBC(920, 240), 1, '⊸'], ['sense', ...PBC(985, 240), 1, '⇥'], ['lift', ...PBC(1050, 240), 1, '✂↑'],
  ['plus', ...PBC(1160, 127), 1, '+'], ['left', ...PBC(1112, 187), 1, '‹'], ['right', ...PBC(1229, 190), 1, '›'], ['minus', ...PBC(1175, 252), 1, '−'],
  ['p', ...PBC(1290, 127), 1.3, 'P'], ['reset', ...PBC(1297, 255), 1.3, 'Reset']
].map(([id, x, y, w, label]) => [id, x, y, w, label]);
function panelButtonAt(point){
  let best = null, bd = 1e9;
  for(const [id, x, y, w] of PB_DEF){
    const dx = (point.x - x)/Math.max(.55, w/2), dy = (point.y - y)/.55, d = dx*dx + dy*dy;
    if(d < bd){ bd = d; best = {id} }
  }
  return bd <= 1.6 ? best : null;
}

function setupModel(gltf){
  model = gltf.scene; scene.add(model);
  const bump = noiseTex(); bump.repeat.set(.18, .18);
  const matFix = new Map();
  model.traverse(o => {
    if(!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    let p = o, part = null, xr = false, names = [];
    while(p){ if(!part && p.userData && p.userData.part) part = p.userData.part; names.push(p.name || ''); p = p.parent }
    xr = names.some(n => XRAY_RX.test(n));
    let m = o.material;
    if(!matFix.has(m)){
      const n = m.name || '';
      if(n === 'enamel'){ m.bumpMap = bump; m.bumpScale = .05; m.envMapIntensity = .55 }
      if(/chrome|steel/.test(n)) m.envMapIntensity = 1.25;
      if(n === 'panel_photo' || n === 'panel_glass'){ m.roughness = .18; m.envMapIntensity = .9 }
      if(n === 'logo'){ m.transparent = true; m.depthWrite = false; m.polygonOffset = true; m.polygonOffsetFactor = -2 }
      if(/sticker|motor_front|cyan|ruler/.test(n)){ m.polygonOffset = true; m.polygonOffsetFactor = -1 }
      matFix.set(m, true);
    }
    if(part || xr){ o.material = m.clone() }
    if(part){ (parts[part] ||= {meshes:[]}).meshes.push(o); o.userData.partId = part }
    if(xr){ o.userData.xray = true; xrayMats.push(o.material) }
    pickList.push(o);
  });
  // moving groups
  anim.nb = model.getObjectByName('needle_bar_group') || new THREE.Group();
  anim.nb0 = anim.nb.position.y;
  anim.tu = model.getObjectByName('take_up_lever_pivot') || new THREE.Group();
  anim.tu0 = anim.tu.rotation.z;
  const hw = new THREE.Group(); hw.position.set(96.65, 13.0, -21.5); scene.add(hw); anim.hw = hw;
  const fd = new THREE.Group(); scene.add(fd); anim.fd = fd;
  const toHw = [], toFd = [];
  model.traverse(o => { if(/^dial/.test(o.name) && o.isMesh) toHw.push(o); if(/^feed_dog\d/.test(o.name)) toFd.push(o) });
  toHw.forEach(o => hw.attach(o)); toFd.forEach(o => fd.attach(o));
  // LCD overlay plane on the display window
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  panelTex = new THREE.CanvasTexture(cv); panelTex.encoding = THREE.sRGBEncoding; redraw(panelTex);
  const lcdMesh = new THREE.Mesh(new THREE.PlaneGeometry(5.85, 2.91), new THREE.MeshStandardMaterial({map:panelTex, roughness:.2, emissive:0xffffff, emissiveMap:panelTex, emissiveIntensity:.55}));
  lcdMesh.position.set(78.88, 20.6, ZP + .15); lcdMesh.userData.partId = 'control_panel';
  scene.add(lcdMesh); (parts.control_panel ||= {meshes:[]}).meshes.push(lcdMesh); pickList.push(lcdMesh);
  // threads

  for(const id in parts){
    const box = new THREE.Box3();
    parts[id].meshes.forEach(m => { m.updateWorldMatrix(true, false); box.expandByObject(m) });
    parts[id].anchor = box.getCenter(new THREE.Vector3());
  }
  if(parts.table) parts.table.anchor.set(12, -2, -2);
  if(parts.thread_stand) parts.thread_stand.anchor.set(85, 50, -48.5);
  if(parts.pedal) parts.pedal.anchor.set(44, -70, -24);
  if(parts.servo_motor) parts.servo_motor.anchor.set(93.4, 12, -14.5);
}

function buildThreads(){
  const P = (x,y,z,part) => ({p:[x,y,z], part});
  const zf = ZA;
  threads.upper = buildThread([
    P(78.0, 52.6, -48.5, 'thread_stand'), P(78.0, 66.2, -48.5, 'thread_stand'),
    P(56.5, 27.0, -24.2, 'arm_thread_guide'), P(56.62, 25.6, -24.0, 'arm_thread_guide'),
    P(49.1, 21.5, zf+.75, 'pretension'), P(49.6, 15.4, zf+.55, 'pretension'),
    P(49.4, 15.35, zf+.3, 'needle_bar_guide'),
    P(48.0, 13.3, zf+.76, 'tension_assembly'), P(48.9, 11.2, zf+.76, 'tension_assembly'),
    P(47.3, 11.1, zf+.8, 'check_spring'),
    P(45.5, 19.0, zf+.9, 'take_up_lever'),
    P(46.3, 11.25, zf+.4, 'needle_bar_guide'), P(NX, 5.9, NZ+.6, 'needle_bar_guide'),
    P(NX, 1.95, NZ+.1, 'needle'), P(NX, 1.95, NZ-1.0, 'needle')
  ], 0xff5a2e);
  threads.winding = buildThread([
    P(90.7, 52.6, -48.5, 'thread_stand'), P(90.7, 66.2, -48.5, 'thread_stand'),
    P(56.5, 27.0, -24.2, 'arm_thread_guide'), P(74.5, 24.3, -19.8, 'bobbin_winder'), P(75.7, 23.9, -18.7, 'bobbin_winder'),
    P(62.0, 23.7, -19.4, 'bobbin_winder')
  ], 0xf2b233);
}
function buildThread(pts, color){
  const mat = new THREE.MeshStandardMaterial({color, roughness:.6, emissive:color, emissiveIntensity:.35});
  const segs = [];
  for(let i=1;i<pts.length;i++){
    const a = new THREE.Vector3(...pts[i-1].p), b = new THREE.Vector3(...pts[i].p);
    const g = new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 16, .06, 6, false);
    const m = new THREE.Mesh(g, mat); m.visible = false; scene.add(m);
    segs.push({m, total:g.index.count, part:pts[i].part});
  }
  return {pts, segs, cur:0, target:0};
}
function threadReveal(name, n, instant){
  const t = threads[name]; if(!t) return;
  t.target = Math.max(0, Math.min(t.segs.length, n)); if(instant || reduceMotion) t.cur = t.target;
}
function threadIndexFor(name, part){
  const t = threads[name]; if(!t) return -1;
  let idx = -1; t.segs.forEach((s,i) => { if(s.part === part) idx = i });
  return idx;
}
function stepThreads(dt){
  for(const k in threads){
    const t = threads[k];
    if(t.cur !== t.target){ const d = t.target - t.cur, sp = 3.2*dt; t.cur = Math.abs(d) < sp ? t.target : t.cur + Math.sign(d)*sp }
    t.segs.forEach((s,i) => { const f = Math.max(0, Math.min(1, t.cur - i)); s.m.visible = f > 0; s.m.geometry.setDrawRange(0, Math.floor(f*s.total/6)*6) });
  }
}

/* camera */
let camTween = null;
const VIEWS = {
  photo:{target:[66, 11, -19], pos:[66.3, 70.0, 59.0]},           // along the owner's photo-3 line of sight, pulled back for a wide frame
  head:{target:[66, 12, -19], pos:[44, 42, 58]},
  all:{target:[56, -18, -26], pos:[165, 55, 175]},
  hook:{target:[45, -2.4, -20], pos:[22, 16, 12]}
};
function flyTo(target, pos, ms=800){
  const T = new THREE.Vector3(...target), P = new THREE.Vector3(...pos);
  if(reduceMotion || !controls){ controls.target.copy(T); camera.position.copy(P); return }
  camTween = {t0:performance.now(), ms, fromT:controls.target.clone(), fromP:camera.position.clone(), T, P};
}
function focusPart(id){
  const p = parts[id]; if(!p) return;
  const a = p.anchor.clone(); const dist = (PART[id] && PART[id].dist) || 28;
  const dir = camera.position.clone().sub(controls.target).normalize();
  if(HIDDEN.has(id)) dir.set(-.55, .55, .62).normalize();
  else if(dir.y < .05) dir.y = .25, dir.normalize();
  if(dir.z < .2){ dir.z = .6; dir.normalize() }
  if(id==='servo_motor'||id==='handwheel') dir.set(.85, .25, .45).normalize();
  flyTo(a.toArray(), a.clone().add(dir.multiplyScalar(dist)).toArray());
}
function setXray(on){
  xray = on; $('#t-xray').setAttribute('aria-pressed', String(on));
  xrayMats.forEach(m => { m.transparent = on; m.opacity = on ? .14 : 1; m.depthWrite = !on; m.needsUpdate = true });
}
function needXrayFor(ids){ if([...ids].some(i=>HIDDEN.has(i)) && !xray) setXray(true) }
function highlight(ids, focus=true){
  hl.clear(); (ids||[]).forEach(i => { if(parts[i]) hl.add(i) });
  needXrayFor(hl);
  if(focus && ids && ids.length){
    const valid = ids.filter(i => parts[i]);
    if(valid.length === 1) focusPart(valid[0]);
    else if(valid.length > 1){
      const box = new THREE.Box3(); valid.forEach(i => box.expandByPoint(parts[i].anchor));
      const c = box.getCenter(new THREE.Vector3()); const r = Math.max(16, box.getSize(new THREE.Vector3()).length()*1.25);
      const dir = camera.position.clone().sub(controls.target).normalize();
      if(dir.z < .2){ dir.z = .6; dir.normalize() }
      if(valid.some(i => HIDDEN.has(i))) dir.set(-.55, .55, .62).normalize();
      flyTo(c.toArray(), c.clone().add(dir.multiplyScalar(r+8)).toArray());
    }
  }
  updateDots();
}

/* picking */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev){
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickList, false);
  for(const h of hits){
    if(xray && h.object.userData.xray) continue;
    if(!h.object.visible) continue;
    h.object.userData.part = h.object.userData.partId || null;
    return h;
  }
  return null;
}

/* dots */
const dotEls = {};
function makeDots(){
  const box = $('#labels');
  for(const id in parts){
    if(id==='table') continue;
    const b = document.createElement('button'); b.className = 'dot'; b.type = 'button';
    b.setAttribute('aria-label', PART[id]?.n || id); b.title = PART[id]?.n || id;
    b.addEventListener('click', e => { e.stopPropagation(); selectPart(id) });
    box.appendChild(b); dotEls[id] = b;
  }
}
let dotsOn = false;
function updateDots(){ for(const id in dotEls){ dotEls[id].classList.toggle('on', id===selected || hl.has(id)) } }
const _v = new THREE.Vector3();
function placeDots(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  for(const id in dotEls){
    const el = dotEls[id];
    if(!dotsOn && !(id===selected || hl.has(id))){ el.hidden = true; continue }
    _v.copy(parts[id].anchor); if((id==='needle' || id==='needle_bar') && anim.nb) _v.y += anim.nb.position.y - anim.nb0;
    _v.project(camera);
    if(_v.z > 1 || Math.abs(_v.x) > 1.05 || Math.abs(_v.y) > 1.05){ el.hidden = true; continue }
    el.hidden = false;
    el.style.left = ((_v.x*.5+.5)*w).toFixed(1)+'px'; el.style.top = ((-_v.y*.5+.5)*h).toFixed(1)+'px';
    el.classList.toggle('dim', HIDDEN.has(id) && !xray);
  }
}

/* loop */
let last = performance.now(), phase = 0;
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(camTween){
    const k = Math.min(1, (now-camTween.t0)/camTween.ms), e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    controls.target.lerpVectors(camTween.fromT, camTween.T, e); camera.position.lerpVectors(camTween.fromP, camTween.P, e);
    if(k>=1) camTween = null;
  }
  if(sewing && model){
    phase += dt*Math.PI*2*1.1;
    anim.nb.position.y = anim.nb0 - 3.5*(1-Math.cos(phase))/2;           // 35 mm needle-bar stroke (A7-DH)
    anim.tu.rotation.z = anim.tu0 + .28*Math.sin(phase - .6);
    anim.hw.rotation.x = -phase;
    anim.fd.position.z = -.3*Math.sin(phase+1.2); anim.fd.position.y = .12*Math.max(0, Math.sin(phase+1.2+Math.PI/2));
  }
  stepThreads(dt);
  const pulse = .5 + .3*Math.sin(now/1000*5);
  for(const id in parts){
    const on = hl.has(id) || id===selected, hov = id===hoverId;
    const k = on ? pulse : hov ? .22 : 0;
    for(const m of parts[id].meshes){ const mm = m.material; if(mm.emissive && !mm.emissiveMap){ mm.emissive.setHex(0x18b6f0); mm.emissiveIntensity = k } }
  }
  controls.update();
  renderer.render(scene, camera);
  placeDots();
  requestAnimationFrame(frame);
}
function resize(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight; if(!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  camera.fov = camera.aspect < 1.25 ? Math.min(60, 32*1.25/camera.aspect) : 32;
  camera.updateProjectionMatrix();
}

/* ------------------------------------------------------------------ knowledge helpers */
const problems = KB.problems || [];
const likeRank = l => /wysok/i.test(l) ? 0 : /redn|średn/i.test(l) ? 1 : 2;
const likeCls = l => ['p-hi','p-mid','p-lo'][likeRank(l)];
const likeTxt = l => ['wysokie','średnie','niskie'][likeRank(l)];
const partName = id => PART[id]?.n || id;
function problemsForPart(id){ return problems.filter(p => (p.causes||[]).some(c => (c.parts||[]).includes(id))) }

/* part card */
function selectPart(id){
  selected = id; hoverId = null;
  if(HIDDEN.has(id)) setXray(true);
  focusPart(id);
  $('#pc-name').textContent = PART[id]?.n || id;
  $('#pc-desc').textContent = PART[id]?.d || '';
  const rel = problemsForPart(id).slice(0,6);

const TABS = ['diagnoza','naprezenie','ustawienia','nawlekanie','panel','serwis'];
function openTab(name, push=true){
  if(!TABS.includes(name)) name = 'diagnoza';
  document.querySelectorAll('.tab').forEach(b=> b.setAttribute('aria-selected', String(b.dataset.tab===name)));
  TABS.forEach(t=> $('#pane-'+t).hidden = t!==name);
  if(push && location.hash !== '#'+name){ try{ history.replaceState(null,'','#'+name) }catch(e){ location.hash = name } }
  if(name !== 'nawlekanie'){ threadReveal('upper',0); threadReveal('winding',0) }
  else renderThreadState();
  $('#panes').scrollTop = 0;
}

  const up = $('#s-up'), lo = $('#s-lo');
  const upd = ()=> drawSim(+up.value, +lo.value);

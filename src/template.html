<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JACK A7</title>
<meta name="description" content="Interaktywny model 3D stębnówki JACK A7 z diagnostyką ściegu, naprężeniem nici, ustawieniami dla tkanin i nawlekaniem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen workbench — 3D stage on the left, tabbed service manual on the right; stacks on phones. */
:root{
  --bg:#edf1f3; --surface:#ffffff; --sunk:#f4f7f8; --ink:#13212a; --muted:#566771; --line:#d4dde2;
  --accent:#0e9ccf; --accent-ink:#0a6f95; --accent-soft:#e0f3fb; --on-accent:#ffffff;
  --wood:#c27b42; --wood-soft:#f7e8da;
  --good:#1f7d55; --warn:#a9650a; --bad:#bf3527;
  --good-soft:#e2f3ea; --warn-soft:#fbefdc; --bad-soft:#f9e4e1;
  --stage-a:#fbfcfc; --stage-b:#d5dee3;
  --fabric:#cbd5da; --fabric-2:#aebbc2;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1216; --surface:#111b21; --sunk:#0e171c; --ink:#e2ebef; --muted:#8fa1ab; --line:#223139;
  --accent:#38bfe9; --accent-ink:#86d8f3; --accent-soft:#0f2d39; --on-accent:#03202b;
  --wood:#dd9e67; --wood-soft:#36271b;
  --good:#4fc48c; --warn:#e6a443; --bad:#ef7363;
  --good-soft:#12301f; --warn-soft:#352612; --bad-soft:#3a1915;
  --stage-a:#1d2a31; --stage-b:#090f12;
  --fabric:#3b4a51; --fabric-2:#2b383e; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b1216; --surface:#111b21; --sunk:#0e171c; --ink:#e2ebef; --muted:#8fa1ab; --line:#223139;
  --accent:#38bfe9; --accent-ink:#86d8f3; --accent-soft:#0f2d39; --on-accent:#03202b;
  --wood:#dd9e67; --wood-soft:#36271b;
  --good:#4fc48c; --warn:#e6a443; --bad:#ef7363;
  --good-soft:#12301f; --warn-soft:#352612; --bad-soft:#3a1915;
  --stage-a:#1d2a31; --stage-b:#090f12;
  --fabric:#3b4a51; --fabric-2:#2b383e; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:88%;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.01em;line-height:1.05;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.spec{font:500 11.5px/1.4 var(--f-mono);color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.spec b{color:var(--ink);font-weight:500}
.ruler{grid-column:1/-1;height:12px;border-top:1px solid var(--wood);
  background:
   repeating-linear-gradient(90deg,var(--wood) 0 1px,transparent 1px 50px) top/100% 11px no-repeat,
   repeating-linear-gradient(90deg,var(--wood) 0 1px,transparent 1px 10px) top/100% 5px no-repeat;opacity:.75}
.head-wrap{display:grid;gap:8px}
.app>*,.work>*,.head-wrap>*{min-width:0}

/* workbench */
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,460px);gap:12px;min-height:0}
.stage{position:relative;min-height:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 40% 30%,var(--stage-a),var(--stage-b))}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.hot{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dot{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid var(--surface);
  background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:auto;cursor:pointer;padding:0;transition:transform .15s,opacity .2s}
.dot:hover,.dot.on{transform:scale(1.35)}
.dot.dim{opacity:.35}
.dot.on{background:var(--wood)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px/1.3 var(--f-body);padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(12px,-120%);z-index:3}
.tools{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.tools button{pointer-events:auto}
.chip{border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(6px);
  border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none;z-index:1}
.legend{position:absolute;right:12px;bottom:10px;font:500 11.5px var(--f-mono);color:var(--muted);display:flex;gap:10px;z-index:1}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.partcard{position:absolute;left:12px;bottom:36px;width:min(360px,calc(100% - 24px));max-height:60%;overflow:auto;z-index:4;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.partcard h3{margin:0 26px 4px 0;font:700 17px/1.2 var(--f-display);font-stretch:92%}
.partcard p{margin:0 0 8px;font-size:13.5px;color:var(--muted)}
.x{position:absolute;top:8px;right:8px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 6px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}

/* side */
.side{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 6px 0;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:9px 11px 10px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panes{flex:1;min-height:0;overflow:auto;padding:16px 16px 24px}
.pane{display:grid;gap:14px;align-content:start}
h2{margin:0;font:700 20px/1.15 var(--f-display);font-stretch:90%;text-wrap:balance}
h4{margin:0;font:600 12px/1.2 var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lead{margin:0;color:var(--muted);font-size:14px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
.stack{display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);color:var(--ink);font:inherit}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .chip{background:var(--sunk);backdrop-filter:none}
.filters .chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.feature{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;width:100%;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.feature strong{display:block;font:700 15.5px/1.25 var(--f-display);font-stretch:92%}
.feature span{font-size:13px;color:var(--muted)}
.feature svg{width:46px;height:46px}

.list{display:grid;gap:6px}
.item{display:grid;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item b{font-weight:600;font-size:14.5px}
.item small{color:var(--muted);font-size:12.5px;line-height:1.4}
.cat{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}

.back{justify-self:start;border:0;background:none;color:var(--accent-ink);font-weight:600;cursor:pointer;padding:0}
.symptom{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.q{border-left:3px solid var(--wood);padding:4px 0 4px 10px;font-size:14px}
.cause{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.cause header{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.cause header b{font-size:14.5px;line-height:1.35}
.pill{flex:none;font:600 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 7px;border-radius:999px}
.p-hi{background:var(--bad-soft);color:var(--bad)} .p-mid{background:var(--warn-soft);color:var(--warn)} .p-lo{background:var(--sunk);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.steps label{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:13.8px;cursor:pointer;padding:3px 0}
.steps input{margin:3px 0 0;accent-color:var(--accent)}
.steps input:checked + span{color:var(--muted);text-decoration:line-through}
.show{justify-self:start;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 9px;font-size:12.5px;cursor:pointer}
.show:hover{border-color:var(--accent);color:var(--accent-ink)}

/* tension sim */
.sim{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sim svg{display:block;width:100%;height:auto;background:var(--sunk)}
.sim .ctrls{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.ctrl label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.ctrl output{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.ctrl input{width:100%;accent-color:var(--accent)}
.ctrl.lower input{accent-color:var(--wood)}
.verdict{padding:12px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:14px}
.verdict b{font:700 15px/1.3 var(--f-display);font-stretch:92%}
.verdict.ok b{color:var(--good)} .verdict.warn b{color:var(--warn)} .verdict.bad b{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tw table tr:last-child td{border-bottom:0}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:14px}
.box p{margin:0}

/* fabrics */
.fabrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.fab{border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:left;background:var(--surface);cursor:pointer;display:grid;gap:2px}
.fab b{font-size:13.5px;line-height:1.25}
.fab small{font:500 11px var(--f-mono);color:var(--muted)}
.fab[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:minmax(110px,36%) 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.8px;min-width:0}
.kv div:nth-child(odd){background:var(--sunk);color:var(--muted);font-size:12.5px;font-weight:600}
.kv div:nth-last-child(-n+2){border-bottom:0}
.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:9px;padding:8px 13px;cursor:pointer;font-size:13.5px}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}

/* threading */
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.tsteps{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:s}
.tsteps button{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr;gap:8px;border:1px solid transparent;background:none;border-radius:9px;padding:7px 8px;cursor:pointer;font-size:13.8px;align-items:start}
.tsteps button:hover{background:var(--sunk)}
.tsteps button .n{font:600 12px/22px var(--f-mono);width:24px;height:24px;border-radius:50%;text-align:center;background:var(--sunk);border:1px solid var(--line)}
.tsteps button.done .n{background:var(--wood-soft);border-color:var(--wood);color:var(--wood)}
.tsteps button.cur{border-color:var(--accent);background:var(--accent-soft)}
.tsteps button.cur .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* panel buttons */
.pbtns{display:grid;gap:6px}
.pb{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.pb .ic{font:600 13px/1 var(--f-mono);background:#0c1013;color:#e9eef1;border-radius:8px;height:40px;display:grid;place-items:center;border:1px solid #2a3238}
.pb b{font-size:14px}
.pb p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.pb.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{border-color:var(--accent);background:var(--accent-soft)}100%{}}
code,.code{font-family:var(--f-mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px}
a{color:var(--accent-ink)}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width: 920px){
  html,body{height:auto}
  .app{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .hint{display:none}
  .stage{height:60vh;min-height:360px}
  .side{overflow:visible}
  .panes{overflow:visible}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:5}
}
@media (max-width: 480px){ .sim .ctrls{grid-template-columns:1fr} .legend{display:none} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <div class="head-wrap">
    <header class="top">
      <div class="brand">
        <h1><span>JACK</span> A7</h1>
        <p>Stębnówka z elektronicznym transportem — model 3D, diagnostyka i ustawienia</p>
      </div>
      <div class="spec" aria-label="Dane maszyny">
        <span>AC servo <b>550 W</b></span><span>max <b>5000 rpm</b></span><span><b>220 V</b> 50/60 Hz</span><span>S/N <b>1102522P023440165</b></span>
      </div>
    </header>
    <div class="ruler" aria-hidden="true"></div>
  </div>

  <main class="work">
    <section class="stage" id="stage" aria-label="Model 3D maszyny">
      <canvas id="gl" aria-label="Model 3D. Przeciągnij, aby obracać. Kliknij część, aby zobaczyć opis."></canvas>
      <div class="loading" id="loading">Ładowanie modelu 3D…</div>
      <div class="labels" id="labels"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="tools">
        <button class="chip" id="v-photo" type="button">Jak na zdjęciu</button>
        <button class="chip" id="v-head" type="button">Głowica</button>
        <button class="chip" id="v-all" type="button">Całe stanowisko</button>
        <button class="chip" id="v-hook" type="button">Chwytacz</button>
        <button class="chip" id="t-xray" type="button" aria-pressed="false">Prześwietlenie</button>
        <button class="chip" id="t-sew" type="button" aria-pressed="false">Ruch igły</button>
        <button class="chip" id="t-dots" type="button" aria-pressed="false">Punkty</button>
      </div>
      <div class="partcard" id="partcard" hidden>
        <button class="x" id="pc-x" type="button" aria-label="Zamknij opis części">×</button>
        <h3 id="pc-name"></h3>
        <p id="pc-desc"></p>
        <div id="pc-rel" class="stack"></div>
      </div>
      <div class="hint">Przeciągnij: obrót · kółko/szczypanie: zoom · kliknij część</div>
      <div class="legend"><span><i style="background:#ff5a2e"></i>nić górna</span><span><i style="background:#f2b233"></i>nawijanie</span><span>skala 1:1 · cm</span></div>
    </section>

    <aside class="side">
      <nav class="tabs" role="tablist" aria-label="Sekcje">
        <button class="tab" role="tab" data-tab="diagnoza">Diagnoza</button>
        <button class="tab" role="tab" data-tab="naprezenie">Naprężenie</button>
        <button class="tab" role="tab" data-tab="ustawienia">Ustawienia</button>
        <button class="tab" role="tab" data-tab="nawlekanie">Nawlekanie</button>
        <button class="tab" role="tab" data-tab="panel">Panel</button>
        <button class="tab" role="tab" data-tab="serwis">Serwis</button>
      </nav>
      <div class="panes" id="panes">
        <section class="pane" id="pane-diagnoza"></section>
        <section class="pane" id="pane-naprezenie" hidden></section>
        <section class="pane" id="pane-ustawienia" hidden></section>
        <section class="pane" id="pane-nawlekanie" hidden></section>
        <section class="pane" id="pane-panel" hidden></section>
        <section class="pane" id="pane-serwis" hidden></section>
      </div>
    </aside>
  </main>
</div>

<script id="kb" type="application/json">__KB__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
"use strict";
const KB = (()=>{ try{ return JSON.parse(document.getElementById('kb').textContent) }catch(e){ console.error(e); return {} } })();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ parts */
const PART = {
  thread_stand:{n:'Stojak na nici', d:'Teleskopowy stojak z dwoma talerzami na stożki. Górne ramię musi być dokładnie nad stożkiem — inaczej nić skacze i szarpie.', dist:120},
  arm_thread_guide:{n:'Prowadnik nici na ramieniu', d:'Pionowy pręt z oczkami na górze ramienia. Pierwsze miejsce, przez które nić wchodzi na maszynę.', dist:30},
  pretension:{n:'Prowadnik / wstępny naprężacz', d:'Prowadnik z otworami na czole głowicy. Uspokaja nić, zanim trafi między talerzyki naprężacza.', dist:24},
  tension_assembly:{n:'Naprężacz nici górnej', d:'Talerzyki z nakrętką. W prawo (zgodnie z zegarem) = mocniej, w lewo = słabiej. Reguluj ćwierć obrotu naraz.', dist:22},
  check_spring:{n:'Sprężynka kontrolna', d:'Odbiera luz nici, gdy igła schodzi w dół. Za słaba lub złamana daje pętelki i przepuszczone ściegi.', dist:20},

function initGL(){

}

function makeEnv(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(.40, '#e3e9ed'); gr.addColorStop(.52, '#8a949b'); gr.addColorStop(1, '#3d444a');

  g.fillStyle = 'rgba(255,255,255,.95)'; g.fillRect(140, 70, 220, 110); g.fillRect(600, 60, 300, 70); g.fillRect(450, 210, 90, 40);

  const t = new THREE.CanvasTexture(c); t.mapping = THREE.EquirectangularReflectionMapping; t.encoding = THREE.sRGBEncoding;
  const pm = new THREE.PMREMGenerator(renderer); const env = pm.fromEquirectangular(t).texture; t.dispose(); pm.dispose();

}
function noiseTex(){
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const img = g.createImageData(256, 256);
  for(let i=0;i<img.data.length;i+=4){ const v = 128 + (Math.random()-.5)*110; img.data[i]=img.data[i+1]=img.data[i+2]=v; img.data[i+3]=255 }
  g.putImageData(img, 0, 0); g.filter = 'blur(1.4px)'; g.drawImage(c, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

/* --- control panel: button centres measured on the rectified photo of this panel (cm, table frame) */
const PBC = (px, py) => [59.8 + px/48, 23.2 - py/48];
const PB_DEF = [
  ['len', ...PBC(630, 90), 2.2, '+ ⟷ −'], ['voice', ...PBC(727, 90), 1, '◁))'],
  ['ab', ...PBC(598, 162), 1, 'A/B'], ['needle', ...PBC(665, 162), 1, '↕'], ['trim', ...PBC(728, 162), 1, '✂'],
  ['cd', ...PBC(600, 237), 1, 'C/D'], ['feed', ...PBC(668, 237), 1, '⬭'], ['condense', ...PBC(731, 237), 1, '⇊'], ['multi', ...PBC(795, 240), 1, 'A~D'],
  ['wn', ...PBC(857, 240), 1, 'W/N'], ['clamp', ...PBC(920, 240), 1, '⊸'], ['sense', ...PBC(985, 240), 1, '⇥'], ['lift', ...PBC(1050, 240), 1, '✂↑'],
  ['plus', ...PBC(1160, 127), 1, '+'], ['left', ...PBC(1112, 187), 1, '‹'], ['right', ...PBC(1229, 190), 1, '›'], ['minus', ...PBC(1175, 252), 1, '−'],
  ['p', ...PBC(1290, 127), 1.3, 'P'], ['reset', ...PBC(1297, 255), 1.3, 'Reset']
].map(([id, x, y, w, label]) => [id, x, y, w, label]);
function panelButtonAt(point){
  let best = null, bd = 1e9;
  for(const [id, x, y, w] of PB_DEF){
    const dx = (point.x - x)/Math.max(.55, w/2), dy = (point.y - y)/.55, d = dx*dx + dy*dy;
    if(d < bd){ bd = d; best = {id} }

  return bd <= 1.6 ? best : null;
}
/* LCD overlay drawn over the real (dark) display window */

function redraw(t){ if(!t) return; drawLCD(t.image.getContext('2d'), t.image.width, t.image.height); t.needsUpdate = true }

function setupModel(gltf){
  model = gltf.scene; scene.add(model);
  const bump = noiseTex(); bump.repeat.set(.18, .18);
  const matFix = new Map();
  model.traverse(o => {
    if(!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    let p = o, part = null, xr = false, names = [];
    while(p){ if(!part && p.userData && p.userData.part) part = p.userData.part; names.push(p.name || ''); p = p.parent }
    xr = names.some(n => XRAY_RX.test(n));
    let m = o.material;
    if(!matFix.has(m)){
      const n = m.name || '';
      if(n === 'enamel'){ m.bumpMap = bump; m.bumpScale = .05; m.envMapIntensity = .55 }
      if(/chrome|steel/.test(n)) m.envMapIntensity = 1.25;
      if(n === 'panel_photo' || n === 'panel_glass'){ m.roughness = .18; m.envMapIntensity = .9 }
      if(n === 'logo'){ m.transparent = true; m.depthWrite = false; m.polygonOffset = true; m.polygonOffsetFactor = -2 }
      if(/sticker|motor_front|cyan|ruler/.test(n)){ m.polygonOffset = true; m.polygonOffsetFactor = -1 }
      matFix.set(m, true);
    }
    if(part || xr){ o.material = m.clone() }
    if(part){ (parts[part] ||= {meshes:[]}).meshes.push(o); o.userData.partId = part }
    if(xr){ o.userData.xray = true; xrayMats.push(o.material) }
    pickList.push(o);
  });
  // moving groups
  anim.nb = model.getObjectByName('needle_bar_group') || new THREE.Group();
  anim.nb0 = anim.nb.position.y;
  anim.tu = model.getObjectByName('take_up_lever_pivot') || new THREE.Group();
  anim.tu0 = anim.tu.rotation.z;
  const hw = new THREE.Group(); hw.position.set(96.65, 13.0, -21.5); scene.add(hw); anim.hw = hw;
  const fd = new THREE.Group(); scene.add(fd); anim.fd = fd;
  const toHw = [], toFd = [];
  model.traverse(o => { if(/^dial/.test(o.name) && o.isMesh) toHw.push(o); if(/^feed_dog\d/.test(o.name)) toFd.push(o) });
  toHw.forEach(o => hw.attach(o)); toFd.forEach(o => fd.attach(o));
  // LCD overlay plane on the display window
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  panelTex = new THREE.CanvasTexture(cv); panelTex.encoding = THREE.sRGBEncoding; redraw(panelTex);
  const lcdMesh = new THREE.Mesh(new THREE.PlaneGeometry(5.85, 2.91), new THREE.MeshStandardMaterial({map:panelTex, roughness:.2, emissive:0xffffff, emissiveMap:panelTex, emissiveIntensity:.55}));
  lcdMesh.position.set(78.88, 20.6, ZP + .15); lcdMesh.userData.partId = 'control_panel';
  scene.add(lcdMesh); (parts.control_panel ||= {meshes:[]}).meshes.push(lcdMesh); pickList.push(lcdMesh);
  // threads
  buildThreads();
  // anchors
  for(const id in parts){
    const box = new THREE.Box3();
    parts[id].meshes.forEach(m => { m.updateWorldMatrix(true, false); box.expandByObject(m) });
    parts[id].anchor = box.getCenter(new THREE.Vector3());
  }
  if(parts.table) parts.table.anchor.set(12, -2, -2);
  if(parts.thread_stand) parts.thread_stand.anchor.set(85, 50, -48.5);
  if(parts.pedal) parts.pedal.anchor.set(44, -70, -24);
  if(parts.servo_motor) parts.servo_motor.anchor.set(93.4, 12, -14.5);
}

function buildThreads(){
  const P = (x,y,z,part) => ({p:[x,y,z], part});
  const zf = ZA;
  threads.upper = buildThread([
    P(78.0, 52.6, -48.5, 'thread_stand'), P(78.0, 66.2, -48.5, 'thread_stand'),
    P(56.5, 27.0, -24.2, 'arm_thread_guide'), P(56.62, 25.6, -24.0, 'arm_thread_guide'),
    P(49.1, 21.5, zf+.75, 'pretension'), P(49.6, 15.4, zf+.55, 'pretension'),
    P(49.4, 15.35, zf+.3, 'needle_bar_guide'),
    P(48.0, 13.3, zf+.76, 'tension_assembly'), P(48.9, 11.2, zf+.76, 'tension_assembly'),
    P(47.3, 11.1, zf+.8, 'check_spring'),
    P(45.5, 19.0, zf+.9, 'take_up_lever'),
    P(46.3, 11.25, zf+.4, 'needle_bar_guide'), P(NX, 5.9, NZ+.6, 'needle_bar_guide'),
    P(NX, 1.95, NZ+.1, 'needle'), P(NX, 1.95, NZ-1.0, 'needle')
  ], 0xff5a2e);
  threads.winding = buildThread([
    P(90.7, 52.6, -48.5, 'thread_stand'), P(90.7, 66.2, -48.5, 'thread_stand'),
    P(56.5, 27.0, -24.2, 'arm_thread_guide'), P(74.5, 24.3, -19.8, 'bobbin_winder'), P(75.7, 23.9, -18.7, 'bobbin_winder'),
    P(62.0, 23.7, -19.4, 'bobbin_winder')
  ], 0xf2b233);
}
function buildThread(pts, color){
  const mat = new THREE.MeshStandardMaterial({color, roughness:.6, emissive:color, emissiveIntensity:.35});
  const segs = [];
  for(let i=1;i<pts.length;i++){
    const a = new THREE.Vector3(...pts[i-1].p), b = new THREE.Vector3(...pts[i].p);
    const g = new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 16, .06, 6, false);
    const m = new THREE.Mesh(g, mat); m.visible = false; scene.add(m);
    segs.push({m, total:g.index.count, part:pts[i].part});
  }
  return {pts, segs, cur:0, target:0};
}
function threadReveal(name, n, instant){
  const t = threads[name]; if(!t) return;
  t.target = Math.max(0, Math.min(t.segs.length, n)); if(instant || reduceMotion) t.cur = t.target;
}
function threadIndexFor(name, part){
  const t = threads[name]; if(!t) return -1;
  let idx = -1; t.segs.forEach((s,i) => { if(s.part === part) idx = i });
  return idx;
}
function stepThreads(dt){
  for(const k in threads){
    const t = threads[k];
    if(t.cur !== t.target){ const d = t.target - t.cur, sp = 3.2*dt; t.cur = Math.abs(d) < sp ? t.target : t.cur + Math.sign(d)*sp }
    t.segs.forEach((s,i) => { const f = Math.max(0, Math.min(1, t.cur - i)); s.m.visible = f > 0; s.m.geometry.setDrawRange(0, Math.floor(f*s.total/6)*6) });
  }
}

/* camera */
let camTween = null;
const VIEWS = {
  photo:{target:[66, 11, -19], pos:[66.3, 70.0, 59.0]},           // along the owner's photo-3 line of sight, pulled back for a wide frame
  head:{target:[66, 12, -19], pos:[44, 42, 58]},
  all:{target:[56, -18, -26], pos:[165, 55, 175]},
  hook:{target:[45, -2.4, -20], pos:[22, 16, 12]}
};
function flyTo(target, pos, ms=800){
  const T = new THREE.Vector3(...target), P = new THREE.Vector3(...pos);
  if(reduceMotion || !controls){ controls.target.copy(T); camera.position.copy(P); return }
  camTween = {t0:performance.now(), ms, fromT:controls.target.clone(), fromP:camera.position.clone(), T, P};
}
function focusPart(id){
  const p = parts[id]; if(!p) return;
  const a = p.anchor.clone(); const dist = (PART[id] && PART[id].dist) || 28;
  const dir = camera.position.clone().sub(controls.target).normalize();
  if(HIDDEN.has(id)) dir.set(-.55, .55, .62).normalize();
  else if(dir.y < .05) dir.y = .25, dir.normalize();
  if(dir.z < .2){ dir.z = .6; dir.normalize() }
  if(id==='servo_motor'||id==='handwheel') dir.set(.85, .25, .45).normalize();
  flyTo(a.toArray(), a.clone().add(dir.multiplyScalar(dist)).toArray());
}
function setXray(on){
  xray = on; $('#t-xray').setAttribute('aria-pressed', String(on));
  xrayMats.forEach(m => { m.transparent = on; m.opacity = on ? .14 : 1; m.depthWrite = !on; m.needsUpdate = true });
}
function needXrayFor(ids){ if([...ids].some(i=>HIDDEN.has(i)) && !xray) setXray(true) }
function highlight(ids, focus=true){
  hl.clear(); (ids||[]).forEach(i => { if(parts[i]) hl.add(i) });
  needXrayFor(hl);
  if(focus && ids && ids.length){
    const valid = ids.filter(i => parts[i]);
    if(valid.length === 1) focusPart(valid[0]);
    else if(valid.length > 1){
      const box = new THREE.Box3(); valid.forEach(i => box.expandByPoint(parts[i].anchor));
      const c = box.getCenter(new THREE.Vector3()); const r = Math.max(16, box.getSize(new THREE.Vector3()).length()*1.25);
      const dir = camera.position.clone().sub(controls.target).normalize();
      if(dir.z < .2){ dir.z = .6; dir.normalize() }
      if(valid.some(i => HIDDEN.has(i))) dir.set(-.55, .55, .62).normalize();
      flyTo(c.toArray(), c.clone().add(dir.multiplyScalar(r+8)).toArray());
    }
  }
  updateDots();
}

/* picking */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev){
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(pickList, false);
  for(const h of hits){
    if(xray && h.object.userData.xray) continue;
    if(!h.object.visible) continue;
    h.object.userData.part = h.object.userData.partId || null;
    return h;
  }
  return null;
}

/* dots */
const dotEls = {};
function makeDots(){
  const box = $('#labels');
  for(const id in parts){
    if(id==='table') continue;
    const b = document.createElement('button'); b.className = 'dot'; b.type = 'button';
    b.setAttribute('aria-label', PART[id]?.n || id); b.title = PART[id]?.n || id;
    b.addEventListener('click', e => { e.stopPropagation(); selectPart(id) });
    box.appendChild(b); dotEls[id] = b;
  }
}
let dotsOn = false;
function updateDots(){ for(const id in dotEls){ dotEls[id].classList.toggle('on', id===selected || hl.has(id)) } }
const _v = new THREE.Vector3();
function placeDots(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  for(const id in dotEls){
    const el = dotEls[id];
    if(!dotsOn && !(id===selected || hl.has(id))){ el.hidden = true; continue }
    _v.copy(parts[id].anchor); if((id==='needle' || id==='needle_bar') && anim.nb) _v.y += anim.nb.position.y - anim.nb0;
    _v.project(camera);
    if(_v.z > 1 || Math.abs(_v.x) > 1.05 || Math.abs(_v.y) > 1.05){ el.hidden = true; continue }
    el.hidden = false;
    el.style.left = ((_v.x*.5+.5)*w).toFixed(1)+'px'; el.style.top = ((-_v.y*.5+.5)*h).toFixed(1)+'px';
    el.classList.toggle('dim', HIDDEN.has(id) && !xray);
  }
}

/* loop */
let last = performance.now(), phase = 0;
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(camTween){
    const k = Math.min(1, (now-camTween.t0)/camTween.ms), e = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    controls.target.lerpVectors(camTween.fromT, camTween.T, e); camera.position.lerpVectors(camTween.fromP, camTween.P, e);
    if(k>=1) camTween = null;
  }
  if(sewing && model){
    phase += dt*Math.PI*2*1.1;
    anim.nb.position.y = anim.nb0 - 3.5*(1-Math.cos(phase))/2;           // 35 mm needle-bar stroke (A7-DH)
    anim.tu.rotation.z = anim.tu0 + .28*Math.sin(phase - .6);
    anim.hw.rotation.x = -phase;
    anim.fd.position.z = -.3*Math.sin(phase+1.2); anim.fd.position.y = .12*Math.max(0, Math.sin(phase+1.2+Math.PI/2));
  }
  stepThreads(dt);
  const pulse = .5 + .3*Math.sin(now/1000*5);
  for(const id in parts){
    const on = hl.has(id) || id===selected, hov = id===hoverId;
    const k = on ? pulse : hov ? .22 : 0;
    for(const m of parts[id].meshes){ const mm = m.material; if(mm.emissive && !mm.emissiveMap){ mm.emissive.setHex(0x18b6f0); mm.emissiveIntensity = k } }
  }
  controls.update();
  renderer.render(scene, camera);
  placeDots();
  requestAnimationFrame(frame);
}
function resize(){
  const w = stageEl.clientWidth, h = stageEl.clientHeight; if(!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  camera.fov = camera.aspect < 1.25 ? Math.min(60, 32*1.25/camera.aspect) : 32;
  camera.updateProjectionMatrix();
}

function drawSim(u, l){
  const fmt = v => v===0 ? '0' : (v>0?'+':'') + v;
  $('#o-up').textContent = fmt(u) + (u>0?' mocniej':u<0?' słabiej':' norma');
  $('#o-lo').textContent = fmt(l) + (l>0?' mocniej':l<0?' słabiej':' norma');
  const b = u - l, sum = u + l;
  const top = 86, bot = 144, mid = 115;
  const knot = Math.max(top-10, Math.min(bot+10, mid - b*9.5));
  const holes = [75,175,275,375,475,575];
  const pucker = Math.max(0, sum-3) * 2.2;
  const sag = Math.max(0, -sum-3) * 3;
  const wave = x => pucker ? Math.sin(x/50*Math.PI)*pucker : 0;
  let fabric = '';
  ['top','bot'].forEach((layer,li)=>{
    const y0 = li ? mid : top, y1 = li ? bot : mid;
    let d = `M0 ${y0+wave(0)}`; for(let x=0;x<=600;x+=20) d += ` L${x} ${y0+wave(x)}`;
    for(let x=600;x>=0;x-=20) d += ` L${x} ${y1+wave(x)}`;
    fabric += `<path d="${d}Z" fill="${li?'var(--fabric-2)':'var(--fabric)'}"/>`;
  });
  let U = `M0 ${top-2+wave(0)}`, L = `M0 ${bot+2+wave(0)}`, loops = '';
  let px = 0;
  holes.forEach((h,i)=>{
    const prev = i ? holes[i-1] : 0;
    const mx = (prev+h)/2;
    const kY = knot + wave(h);
    U += ` Q${mx} ${top-2-sag*(i?1:0)+wave(mx)} ${h-7} ${top-2+wave(h)} L${h} ${kY}`;
    L += ` Q${mx} ${bot+2+sag*(i?1:0)+wave(mx)} ${h-7} ${bot+2+wave(h)} L${h} ${kY}`;
    if(b <= -3){ const ly = bot+wave(h); loops += `<path d="M${h} ${ly} C${h+22} ${ly+38} ${h-22} ${ly+38} ${h} ${ly}" fill="none" stroke="#ff5a2e" stroke-width="3"/>` }
    if(b >= 3){ const ly = top+wave(h); loops += `<path d="M${h} ${ly} C${h+20} ${ly-34} ${h-20} ${ly-34} ${h} ${ly}" fill="none" stroke="var(--wood)" stroke-width="3"/>` }
    U += ` L${h+7} ${top-2+wave(h)}`; L += ` L${h+7} ${bot+2+wave(h)}`;
  });
  U += ` L600 ${top-2+wave(600)}`; L += ` L600 ${bot+2+wave(600)}`;
  const knots = holes.map(h=>`<circle cx="${h}" cy="${knot+wave(h)}" r="5" fill="var(--ink)" opacity=".75"/>`).join('');
  $('#sim-svg').innerHTML = `
    <text x="12" y="22" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="var(--muted)">WIERZCH</text>
    <text x="12" y="222" font-size="13" font-family="IBM Plex Sans, sans-serif" font-weight="600" fill="var(--muted)">SPÓD</text>
    <line x1="0" x2="600" y1="${mid}" y2="${mid}" stroke="var(--ink)" stroke-opacity=".18" stroke-dasharray="4 5"/>
    ${fabric}
    <path d="${L}" fill="none" stroke="var(--wood)" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="${U}" fill="none" stroke="#ff5a2e" stroke-width="3.2" stroke-linejoin="round"/>
    ${loops}${knots}
    <text x="588" y="22" text-anchor="end" font-size="12" font-family="IBM Plex Mono, monospace" fill="#ff5a2e">nić górna</text>
    <text x="588" y="222" text-anchor="end" font-size="12" font-family="IBM Plex Mono, monospace" fill="var(--wood)">nić dolna</text>`;
  let cls='ok', head='Ścieg zrównoważony', txt='Supeł leży w środku materiału. Ścieg wygląda tak samo z obu stron. Nic nie zmieniaj.';
  if(b <= -3){ cls='bad'; head='Pętelki od spodu'; txt='Nić górna jest za luźna i ciągnie się pod materiałem. Dokręć naprężacz górny w prawo, po ¼ obrotu, i szyj próbkę po każdej zmianie. Jeśli pętelki zostają przy dobrym naprężeniu: nić nie siedzi między talerzykami (nawlekaj przy podniesionej stopce) albo sprężynka kontrolna nie działa.' }
  else if(b <= -1){ cls='warn'; head='Nić górna przeciągana na spód'; txt='Od spodu widać punkciki nici górnej. Dokręć naprężacz górny w prawo o ¼ obrotu albo, jeśli góra jest już mocna, poluzuj bębenek o bardzo mały krok.' }
  else if(b >= 3){ cls='bad'; head='Nić dolna wyciągana na wierzch'; txt='Na wierzchu leży nić dolna albo jej pętelki. Poluzuj naprężacz górny w lewo po ¼ obrotu. Jeśli górny jest już luźny, a nić dolna dalej wychodzi, dokręć bębenek (śrubka w prawo, ok. 1/16 obrotu) i zrób test jo-jo.' }
  else if(b >= 1){ cls='warn'; head='Nić dolna lekko widoczna z wierzchu'; txt='Kropki nici dolnej na wierzchu. Poluzuj naprężacz górny o ¼ obrotu albo minimalnie dokręć bębenek.' }
  if(sum >= 5){ cls = 'bad'; head += ' · oba naprężenia za mocne'; txt += ' Materiał się marszczy, a nić może pękać. Najpierw ustaw bębenek testem jo-jo, potem poluzuj nić górną.' }
  else if(sum <= -5){ cls = cls==='ok'?'warn':cls; head += ' · oba naprężenia za słabe'; txt += ' Ścieg jest luźny i da się go podważyć paznokciem. Ustaw bębenek testem jo-jo, potem dokręcaj górę.' }
  const v = $('#sim-v'); v.className = 'verdict '+cls; v.innerHTML = `<b>${esc(head)}</b><span>${esc(txt)}</span>`;
}

    <div class="stack"><h2>Nawlekanie krok po kroku</h2>
    <p class="lead">Kliknij krok albo użyj przycisków. Na modelu nić rysuje się w miarę postępu, a bieżąca część miga.</p></div>
    <div class="seg" role="group" aria-label="Rodzaj">${[['upper','Nić górna'],['bobbin','Szpulka do bębenka'],['wind','Nawijanie szpulki']].map(([k,l])=>`<button type="button" data-thm="${k}" aria-pressed="${k===thMode}">${l}</button>`).join('')}</div>
    <div class="row"><button class="btn" type="button" id="th-next">${thStep<0?'Zacznij':'Następny krok'}</button><button class="btn ghost" type="button" id="th-prev">Wstecz</button><button class="btn ghost" type="button" id="th-all">Pokaż całą drogę</button></div>
    <ol class="tsteps">${list.map((s,i)=>`<li><button type="button" data-st="${i}" class="${i<thStep?'done':i===thStep?'cur':''}"><span class="n">${i+1}</span><span>${esc(s.text)}${s.part?` <span class="muted small">· ${esc(partName(s.part))}</span>`:''}</span></button></li>`).join('')}</ol>
    <p class="small muted" style="margin:0">Przed nawlekaniem wyłącz zasilanie. Stopka podniesiona — wtedy talerzyki naprężacza są otwarte i nić wchodzi między nie.</p>`;
  el.querySelectorAll('[data-thm]').forEach(b=> b.addEventListener('click', ()=>{ thMode = b.dataset.thm; thStep = -1; renderThread(); renderThreadState() }));
  el.querySelectorAll('[data-st]').forEach(b=> b.addEventListener('click', ()=>{ thStep = +b.dataset.st; renderThread(); renderThreadState() }));
  $('#th-next').addEventListener('click', ()=>{ thStep = Math.min(list.length-1, thStep+1); renderThread(); renderThreadState() });
  $('#th-prev').addEventListener('click', ()=>{ thStep = Math.max(-1, thStep-1); renderThread(); renderThreadState() });
  $('#th-all').addEventListener('click', ()=>{ thStep = list.length-1; renderThread(); renderThreadState(true) });
}
function renderThreadState(whole){
  if(!threads.upper) return;
  const list = thList();
  const tname = thMode==='upper' ? 'upper' : thMode==='wind' ? 'winding' : null;
  threadReveal(thMode==='upper'?'winding':'upper', 0, true);
  if(tname){
    let n = 0;
    for(let i=0;i<=thStep && i<list.length;i++){ const idx = threadIndexFor(tname, list[i].part); if(idx+1 > n) n = idx+1 }
    if(whole) n = threads[tname].segs.length;
    threadReveal(tname, n);
  }
  const s = list[thStep];
  if(whole){ highlight([], false); flyTo(...(thMode==='upper' ? [[64,32,-30],[5,70,95]] : [[72,40,-30],[25,85,90]])) }
  else if(s && s.part){ if(thMode==='bobbin') setXray(true); highlight([s.part], true) }
  else if(thStep<0){ highlight([], false) }
}

/* ------------------------------------------------------------------ PANEL */
const PB_NAMES = {len:'Długość ściegu',voice:'Komunikaty głosowe',ab:'Rygiel początkowy',needle:'Pozycja igły po zatrzymaniu',trim:'Obcinanie nici',cd:'Rygiel końcowy',feed:'Tryb transportu',condense:'Zagęszczenie ściegu',multi:'Szycie odcinkowe A~D',wn:'W/N',clamp:'Zacisk nici',sense:'Wykrywanie grubości materiału',lift:'Podnoszenie stopki',plus:'Speed +',minus:'Speed −',left:'W lewo',right:'W prawo',p:'P — parametry',reset:'Reset (ustawienia fabryczne)'};
const PB_RX = [
  ['reset',/reset|fabryczn/i],['p',/^p\b|parametr|\bP\b/i],['plus',/speed\s*\+|przyspie|zwiększ.*prędk|plus/i],['minus',/speed\s*[-−]|zwolni|zmniejsz.*prędk|minus/i],
  ['left',/lewo|left/i],['right',/prawo|right/i],['voice',/głos|voice|speak|dźwięk/i],['len',/długo|length|\bmm\b/i],
  ['sense',/grubo|czujnik|sens|wykryw/i],['lift',/podnies|unies|lift/i],['condense',/zagęszcz|condens/i],['multi',/A\s*~\s*D|odcink|wielo|multi|stał/i],
  ['wn',/W\s*\/?\s*N/i],['ab',/A\s*\/\s*B|początk/i],['cd',/C\s*\/\s*D|końc/i],['needle',/pozycj|igł.*(gór|dół)|needle/i],['trim',/obcin|trim/i],
  ['feed',/transport|feed|rodzaj materia/i],['clamp',/zacisk|clamp/i]
];
const pbMap = {};
(function mapButtons(){
  const kb = KB.panel_buttons || []; const used = new Set();
  for(const [id, rx] of PB_RX){
    const hit = kb.find((b,i)=> !used.has(i) && (rx.test(b.id||'') || rx.test(b.name||'') || rx.test(b.icon_hint||'')));
    if(hit){ used.add(kb.indexOf(hit)); pbMap[id] = hit }
  }
  pbMap._rest = kb.filter((b,i)=>!used.has(i));
  if(!pbMap.wn && pbMap.multi) pbMap.wn = pbMap.multi;
})();
function renderPanel(){
  const pr = KB.parameters || {}, errs = KB.errors || [];
  const order = PB_DEF.map(d=>d[0]);
  const ic = id => PB_DEF.find(d=>d[0]===id)?.[4] || '';
  const card = (id, b) => `<article class="pb" id="pb-${id}"><div class="ic">${esc(ic(id))}</div><div><b>${esc(b?.name || PB_NAMES[id])}</b>${b?.short?`<p><b>Krótko:</b> ${esc(b.short)}</p>`:''}${b?.long?`<p><b>Długo:</b> ${esc(b.long)}</p>`:''}${!b?'<p>Brak opisu w instrukcji, sprawdź na wyświetlaczu.</p>':''}</div></article>`;
  const el = $('#pane-panel');
  el.innerHTML = `
    <div class="stack"><h2>Panel sterowania</h2><p class="lead">Kliknij przycisk na modelu panelu, a jego opis zostanie tu podświetlony.</p>
    <div class="row"><button class="show" type="button" id="pp-show">Pokaż panel na modelu</button></div></div>
    <div class="pbtns">${order.map(id=>card(id, pbMap[id])).join('')}${(pbMap._rest||[]).map((b,i)=>`<article class="pb"><div class="ic">•</div><div><b>${esc(b.name)}</b>${b.short?`<p><b>Krótko:</b> ${esc(b.short)}</p>`:''}${b.long?`<p><b>Długo:</b> ${esc(b.long)}</p>`:''}</div></article>`).join('')}</div>
    ${(pr.list||[]).length||pr.how_to_enter?`<h4>Parametry</h4>${pr.how_to_enter?`<div class="box"><p>${esc(pr.how_to_enter)}</p></div>`:''}
      <input type="search" id="pp-q" placeholder="Szukaj parametru" aria-label="Szukaj parametru">
      <div class="tw"><table><thead><tr><th>Kod</th><th>Nazwa</th><th>Zakres / domyślnie</th></tr></thead><tbody id="pp-body"></tbody></table></div>`:''}
    ${errs.length?`<h4>Kody błędów</h4><div class="tw"><table><thead><tr><th>Kod</th><th>Znaczenie</th><th>Co zrobić</th></tr></thead><tbody>${errs.map(e=>`<tr><td class="mono"><b>${esc(e.code)}</b></td><td>${esc(e.meaning)}</td><td>${esc(e.fix)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
  const body = $('#pp-body');
  const fill = q => { if(!body) return; q = (q||'').toLowerCase(); body.innerHTML = (pr.list||[]).filter(p=>!q || JSON.stringify(p).toLowerCase().includes(q)).map(p=>`<tr><td class="mono"><b>${esc(p.code)}</b></td><td>${esc(p.name)}${p.tip?`<div class="small muted">${esc(p.tip)}</div>`:''}</td><td class="mono small">${esc(p.range)}${p.default?` · <b>${esc(p.default)}</b>`:''}</td></tr>`).join('') };
  fill(''); const q = $('#pp-q'); if(q) q.addEventListener('input', e=> fill(e.target.value));
  $('#pp-show').addEventListener('click', ()=> highlight(['control_panel'], true));
}
function flashButton(id){
  openTab('panel');
  const el = document.getElementById('pb-'+id); if(!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  el.scrollIntoView({block:'center', behavior: reduceMotion?'auto':'smooth'});
}

/* ------------------------------------------------------------------ SERWIS */
function renderService(){
  const m = KB.machine || {};
  const el = $('#pane-serwis');
  el.innerHTML = `
    <div class="stack"><h2>Konserwacja i dane</h2>${m.variant_notes?`<p class="lead">${esc(m.variant_notes)}</p>`:''}</div>
    ${(KB.maintenance||[]).length?`<h4>Harmonogram</h4><div class="tw"><table><thead><tr><th>Kiedy</th><th>Co zrobić</th></tr></thead><tbody>${KB.maintenance.map(x=>`<tr><td><b>${esc(x.interval)}</b></td><td>${esc(x.task)}${(x.parts||[]).length?`<div><button class="show" type="button" data-parts="${esc(x.parts.join(','))}" style="margin-top:6px">Pokaż: ${esc(x.parts.map(partName).join(', '))}</button></div>`:''}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${(m.specs||[]).length?`<h4>Dane techniczne</h4><div class="kv">${m.specs.map(s=>`<div>${esc(s.k)}</div><div>${esc(s.v)}</div>`).join('')}</div>`:''}
    ${(KB.safety||[]).length?`<h4>Bezpieczeństwo</h4><div class="box">${KB.safety.map(s=>`<p>• ${esc(s)}</p>`).join('')}</div>`:''}
    ${(KB.sources||[]).length?`<h4>Źródła</h4><div class="stack small">${KB.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`).join('')}</div>`:''}
    <p class="foot">Nieoficjalny pomocnik do własnej maszyny, zbudowany na podstawie instrukcji i ogólnej praktyki szwalniczej. Teksty oznaczone „(praktyka ogólna)” nie pochodzą z instrukcji JACK. Regulację chwytacza, wysokości igielnicy i elektroniki zostaw serwisowi.</p>`;
  el.addEventListener('click', e=>{ const s = e.target.closest('[data-parts]'); if(s) highlight(s.dataset.parts.split(','), true) });
}

/* ------------------------------------------------------------------ boot */
renderDiag(); renderTension(); renderSettings(); renderThread(); renderPanel(); renderService();
openTab(location.hash.slice(1) || 'diagnoza', false);

if(initGL()){
  const v = VIEWS.photo; controls.target.set(...v.target); camera.position.set(...v.pos);
  new ResizeObserver(resize).observe(stageEl); resize();
  requestAnimationFrame(frame);
  new THREE.GLTFLoader().load('jack_a7.glb', gltf => {
    setupModel(gltf);
    $('#loading').remove();
    makeDots();
    sendToPanel(false);
    if(location.hash.slice(1) === 'nawlekanie') renderThreadState();
  }, xhr => {
    if(xhr.total) $('#loading').textContent = `Ładowanie modelu 3D… ${Math.round(xhr.loaded/xhr.total*100)}%`;
  }, err => { console.error(err); $('#loading').textContent = 'Nie udało się wczytać modelu 3D (jack_a7.glb).' });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => redraw(panelTex));

  let down = null;
  canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY}; camTween = null });
  canvas.addEventListener('pointerup', e => {
    if(!down) return; const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y); down = null;
    if(moved > 6) return;
    const h = pick(e); const id = h?.object.userData.part;
    if(!id){ closePart(); return }
    if(id === 'control_panel'){ const b = panelButtonAt(h.point); if(b){ selectPart('control_panel'); flashButton(b.id); return } }
    selectPart(id);
  });
  const tip = $('#tip');
  canvas.addEventListener('pointermove', e => {
    if(e.pointerType !== 'mouse' || e.buttons){ tip.hidden = true; return }
    const h = pick(e); const id = h?.object.userData.part || null;
    hoverId = id; canvas.classList.toggle('hot', !!id);
    if(id){
      let label = PART[id]?.n || id;
      if(id === 'control_panel'){ const b = panelButtonAt(h.point); if(b) label = (pbMap[b.id]?.name || PB_NAMES[b.id]) }
      const r = stageEl.getBoundingClientRect(); tip.textContent = label; tip.style.left = (e.clientX-r.left)+'px'; tip.style.top = (e.clientY-r.top)+'px'; tip.hidden = false;
    } else tip.hidden = true;
  });
  canvas.addEventListener('pointerleave', () => { hoverId = null; tip.hidden = true });

  $('#v-photo').addEventListener('click', () => flyTo(VIEWS.photo.target, VIEWS.photo.pos));
  $('#v-head').addEventListener('click', () => flyTo(VIEWS.head.target, VIEWS.head.pos));
  $('#v-all').addEventListener('click', () => flyTo(VIEWS.all.target, VIEWS.all.pos));
  $('#v-hook').addEventListener('click', () => { setXray(true); flyTo(VIEWS.hook.target, VIEWS.hook.pos) });
  $('#t-xray').addEventListener('click', () => setXray(!xray));
  $('#t-sew').addEventListener('click', e => { sewing = !sewing; e.currentTarget.setAttribute('aria-pressed', String(sewing)); if(!sewing && model){ anim.nb.position.y = anim.nb0; anim.tu.rotation.z = anim.tu0; anim.fd.position.set(0,0,0) } });
  $('#t-dots').addEventListener('click', e => { dotsOn = !dotsOn; e.currentTarget.setAttribute('aria-pressed', String(dotsOn)) });
}
</script>
</body>
</html>
